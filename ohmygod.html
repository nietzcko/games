<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Emberwick</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1d2230;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff8e8}
body{position:fixed;inset:0}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none;touch-action:none;padding:8px;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:flex;flex-direction:column}
.hidden{display:none!important}
#top{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{background:rgba(46,36,28,.82);border-radius:12px;padding:6px 9px;display:flex;gap:9px;align-items:center;font-weight:700;font-size:13px;line-height:1}
.chip{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.ic{display:inline-block;width:14px;height:9px;flex:none}
.ic.wood{background:#a8703d;border-radius:4px;box-shadow:inset -4px 0 0 #d9a868}
.ic.stone{background:#9aa2ab;border-radius:50% 45% 40% 55%;height:11px;width:12px}
.ic.grain{background:#e6c34c;width:8px;height:12px;border-radius:50%}
.ic.planks{background:#e2b072;border-radius:2px;box-shadow:inset 0 -3px 0 #b98548}
.ic.bread{background:#c8843f;border-radius:7px 7px 3px 3px;box-shadow:inset 0 3px 0 #e8b06a}
#stat small{font-weight:600;opacity:.75;font-size:11px}
#msn{background:#ffd166;color:#3a2a20;border-radius:8px;padding:3px 7px}
#btns{display:flex;gap:6px;margin-left:auto}
button{font:inherit;pointer-events:auto;background:#f3e4c6;color:#3a2a20;border:0;border-radius:10px;padding:8px 11px;font-weight:700;font-size:13px;min-height:34px;cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(1px)}button:disabled{opacity:.45;cursor:default}
button.primary{background:#ef8354;color:#fff}button.danger{background:#b3362e;color:#fff}
#row2{display:flex;gap:8px;align-items:flex-start;margin-top:6px}
#left{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
#obj{background:rgba(46,36,28,.82);border-left:4px solid #ffd166;border-radius:10px;padding:7px 10px;font-size:13px;font-weight:600;line-height:1.3;max-width:460px}
#obj:empty{display:none}
#raidChip,#terrChip{border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700}
#raidChip{background:#b3362e;animation:pulse 1.2s infinite}
#terrChip{background:rgba(63,138,124,.9)}
@keyframes pulse{50%{filter:brightness(1.25)}}
#mini{width:120px;height:120px;border-radius:12px;border:3px solid rgba(46,36,28,.85);background:#1d2230;flex:none;image-rendering:pixelated}
#toasts{display:flex;flex-direction:column;gap:5px;max-width:min(380px,100%);transition:opacity .3s}#toasts.dim{opacity:.12}
.toast{background:rgba(46,36,28,.86);border-left:4px solid #8ecae6;border-radius:10px;padding:7px 10px;font-size:12.5px;line-height:1.35;font-weight:600;transition:opacity .5s}
.toast.good{border-color:#9bdeac}.toast.warn{border-color:#ffd166}.toast.bad{border-color:#e5484d}.toast.out{opacity:0}
#banner{position:absolute;left:50%;top:24%;z-index:5;pointer-events:none;transform:translate(-50%,-10px);background:rgba(46,36,28,.97);border-radius:16px;padding:12px 18px;text-align:center;max-width:min(440px,90vw);opacity:0;transition:opacity .4s,transform .4s;border-bottom:4px solid #ffd166}
#banner.show{opacity:1;transform:translate(-50%,0)}
#banner b{display:block;font-size:18px;margin-bottom:3px}#banner span{font-size:13px;line-height:1.35;display:block}
#paused{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);background:rgba(46,36,28,.9);border-radius:14px;padding:10px 18px;font-weight:800;font-size:18px}
#bottom{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:6px}
#ctx{background:rgba(46,36,28,.9);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:min(520px,96vw);pointer-events:auto}
.ctxT{flex-basis:100%;text-align:center;font-weight:700;font-size:13px}.ctxS{flex-basis:100%;text-align:center;font-size:11px;opacity:.8}
#ctx button small{display:block;font-weight:600;font-size:10.5px;opacity:.75}
.ctxT small{font-weight:600;opacity:.75}
#mir{background:rgba(46,36,28,.86);border-radius:14px;padding:7px 8px;pointer-events:auto;max-width:96vw}
#faithRow{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;margin-bottom:6px}#faithBar{flex:1;height:7px;border-radius:5px;background:rgba(255,248,232,.2);overflow:hidden;min-width:90px}#faithFill{height:100%;width:0;background:linear-gradient(90deg,#ffd166,#fff3c4);border-radius:5px}
#mirBtns{display:flex;gap:5px;justify-content:center}#mirBtns button{min-width:58px;padding:6px 6px;line-height:1.15;border-bottom:3px solid var(--c,#ffd166)}#mirBtns button small{display:block;font-weight:600;font-size:10.5px;opacity:.75}
.mirNone{font-size:11.5px;font-weight:600;opacity:.75}
#pack{background:rgba(46,36,28,.86);border-radius:14px;padding:7px 10px;min-width:210px;max-width:96vw;font-size:13px;font-weight:700}
#packTop{display:flex;justify-content:space-between;gap:10px;margin-bottom:5px}#toolN{font-weight:600;opacity:.75;margin-left:4px}
#packBar{height:8px;border-radius:5px;background:rgba(255,248,232,.2);overflow:hidden}
#packFill{height:100%;width:0;background:#9bdeac;border-radius:5px;transition:width .15s}
#pack.full #packFill{background:#ef8354}#pack.full{box-shadow:0 0 0 2px #ef8354}
#packItems{display:flex;gap:9px;margin-top:6px;flex-wrap:wrap}
#modal{position:absolute;inset:0;background:rgba(20,16,12,.58);display:flex;align-items:center;justify-content:center;padding:14px;z-index:10}
#card{background:#fbf3df;color:#3a2a20;border-radius:18px;padding:16px;max-width:450px;width:100%;max-height:88%;overflow:auto;-webkit-overflow-scrolling:touch;box-shadow:0 12px 40px rgba(0,0,0,.4)}
#card h2{margin:0 0 8px;font-size:20px}#card p{margin:0 0 10px;font-size:14px;line-height:1.45}
#card .sm{font-size:13px}#card .xs{font-size:11.5px;opacity:.8}#card .err{color:#b3362e;font-weight:700;opacity:1;min-height:1em}
#card button{background:#e9d7ae}#card button.primary{background:#ef8354}#card button.danger{background:#b3362e}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.row{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:700;margin:10px 0}.row input{width:20px;height:20px;margin:0;flex:none}.row small{font-weight:500}
.jrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid #e6d6b0;font-size:14px}.jn{flex:1;font-weight:700}.jc{font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.jrow button{min-width:38px;font-size:17px;padding:4px}.dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid rgba(58,42,32,.25)}
.fac{border-top:1px solid #e6d6b0;padding:8px 0}.fh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.badge{font-size:11.5px;font-weight:800;border-radius:8px;padding:3px 8px;color:#fff}.badge.Undiscovered{background:#8a8072}.badge.Peaceful{background:#4f9a5a}.badge.Wary{background:#c98a1e}.badge.Hostile{background:#b3362e}
.bar{position:relative;height:8px;border-radius:5px;background:#e6d6b0;overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#4f9a5a,#c98a1e 45%,#b3362e 80%)}.bar em{position:absolute;top:0;width:2px;height:100%;background:#3a2a20;opacity:.5}
textarea{width:100%;font:12px ui-monospace,Menlo,Consolas,monospace;border-radius:10px;border:2px solid #e6d6b0;padding:8px;background:#fffaf0;color:#3a2a20;resize:vertical;-webkit-user-select:text;user-select:text}
input[type=file]{width:100%;margin-bottom:8px;font-size:13px}
@media (max-width:560px){.pill{font-size:12px;padding:6px 7px;gap:7px}button{font-size:12px;padding:7px 9px}#mini{width:86px;height:86px}#obj{font-size:12px}#btns{margin-left:0;width:100%}#btns button{flex:1}}
@media (max-height:460px){#mini{width:80px;height:80px}#banner{top:16%}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="top">
    <div class="pill" id="res" aria-label="Warehouse stock"></div>
    <div class="pill" id="stat"><span><small>Folk</small> <span id="pop">0/0</span></span><span id="msn">Camp</span></div>
    <div id="btns"><button id="bPause">Pause</button><button id="bFolk">Folk</button><button id="bFac">Factions</button><button id="bMenu">Menu</button></div>
  </div>
  <div id="row2">
    <div id="left"><div id="obj"></div><div id="raidChip" class="hidden"></div><div id="terrChip" class="hidden"></div><div id="toasts"></div></div>
    <canvas id="mini" width="132" height="132"></canvas>
  </div>
  <div id="banner"><b></b><span></span></div>
  <div id="paused" class="hidden">Paused</div>
  <div id="bottom">
    <div id="ctx" class="hidden"></div>
    <div id="mir"><div id="faithRow"><span>Faith</span><div id="faithBar"><div id="faithFill"></div></div><span id="faithN">60/100</span></div><div id="mirBtns"></div></div>
    <div id="pack"><div id="packTop"><span>Backpack <small id="toolN"></small></span><span id="packN">0/20</span></div><div id="packBar"><div id="packFill"></div></div><div id="packItems" class="hidden"></div></div>
  </div>
</div>
<div id="modal" class="hidden"><div id="card"></div></div>
<script>
'use strict';
/* =====================================================================
   EMBERWICK — a cosy gather-and-build game. One file, vanilla JS + Canvas.
   Sections: 1 Config/Utils · 2 Layout · 3 World/Chunks · 4 Navigation
             5 State · 6 Buildings/Jobs · 7 Villagers · 8 Combat/Enemies
             9 Factions/Raids · 10 Player · 11 Render · 12 UI · 13 Save · 14 Main
   ===================================================================== */

/* ---------- 1. CONFIG & UTILITIES ---------- */
const TILE=32, CH=16, CHPX=TILE*CH, FOGC=4;
const SAVE_KEY='emberwick-save', SAVE_VERSION=4;
const RES=['wood','stone','grain','planks','bread'];
const RES_COL={wood:'#a8703d',stone:'#9aa2ab',grain:'#e6c34c',planks:'#e2b072',bread:'#c8843f'};
const MS_NAMES=['Camp','Hamlet','Village','Town','City'];
const PACK=[20,30,40,55,70], HIT_T=[0.5,0.42,0.36,0.3,0.26];
const HARV_R=46, WEAPON=64, PICK_R=84, DWELL=0.7, ATK_T=0.55;
const B_GRASS=0,B_FOREST=1,B_ROCKY=2,B_FROST=3,B_WATER=4,B_SAND=5,B_GROVE=6;
const HOME={x:16,y:16};
const TAU=Math.PI*2, hyp=Math.hypot;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const tkey=(tx,ty)=>(tx+32768)*65536+(ty+32768);
const ckey=(cx,cy)=>cx+','+cy;
const zeroRes=()=>({wood:0,stone:0,grain:0,planks:0,bread:0});
function hash2(s,x,y){let h=Math.imul(s|0,0x9E3779B1)^Math.imul(x|0,374761393)^Math.imul(y|0,668265263);h=Math.imul(h^(h>>>15),0x85EBCA6B);h=Math.imul(h^(h>>>13),0xC2B2AE35);h^=h>>>16;return (h>>>0)/4294967296;}
function vnoise(s,x,y){const xi=Math.floor(x),yi=Math.floor(y);let fx=x-xi,fy=y-yi;fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);
  const a=hash2(s,xi,yi),b=hash2(s,xi+1,yi),c=hash2(s,xi,yi+1),d=hash2(s,xi+1,yi+1);return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy;}
function fbm(s,x,y){return vnoise(s,x,y)*0.6+vnoise(s+17,x*2.1,y*2.1)*0.3+vnoise(s+31,x*4.3,y*4.3)*0.1;}
function costText(c){const a=[];for(const r in c)if(c[r]>0)a.push(c[r]+' '+r);return a.join(', ');}

/* ---------- 2. LAYOUT (deterministic from the seed) ---------- */
let L=null, G=null;
const BT={
  warehouse:{name:'Warehouse',w:4,h:3,jobs:{hauler:2}},
  house:{name:'House',w:3,h:2,pop:3},
  lumber:{name:'Lumber Camp',w:3,h:2,jobs:{woodcutter:2}},
  quarry:{name:'Quarry',w:3,h:2,jobs:{miner:2}},
  farm:{name:'Farm',w:3,h:2,jobs:{farmer:2}},
  sawmill:{name:'Sawmill',w:3,h:2,jobs:{sawyer:1}},
  bakery:{name:'Bakery',w:3,h:2,jobs:{baker:1}},
  tower:{name:'Watchtower',w:2,h:2,jobs:{guard:1}},
  bridge:{name:'Old Bridge',w:0,h:0},
  outpost:{name:'Frontier Outpost',w:4,h:3,jobs:{guard:1,hauler:1}},
  guardpost:{name:'Guard Post',w:2,h:2,jobs:{guard:2}},
  garden:{name:'Garden',w:3,h:2,pop:1},
};
const CHOICES=['house','farm','lumber','quarry','tower','garden'];
const CHOICE_COST={house:{planks:30,stone:20,bread:8},farm:{wood:40,planks:20},lumber:{wood:30,planks:15},quarry:{wood:30,planks:20},tower:{stone:40,planks:20},garden:{wood:20,stone:20}};
/* Workplaces stack what they make beside the door; you or a hauler carry it to storage. */
const PILE_RES={lumber:'wood',quarry:'stone',farm:'grain',sawmill:'planks',bakery:'bread'}, PILE_CAP=40;
const TOOLS=[{name:'Flint axe',hit:0.5,pow:1,dmg:10,col:'#aab2ba'},{name:'Copper axe',hit:0.4,pow:1,dmg:14,col:'#d98a4a'},{name:'Iron axe',hit:0.32,pow:1,dmg:18,col:'#dfe5ea'},{name:'Steel axe',hit:0.48,pow:2,dmg:23,col:'#8ecae6'},{name:'Master axe',hit:0.34,pow:2,dmg:28,col:'#ffd166'}];
const TOOL_COST=[{wood:25,stone:15},{wood:40,stone:40,planks:10},{stone:60,planks:40,bread:10},{stone:100,planks:80,bread:30}];
/* Fighting has its own track, separate from the axe: trained at the staff rack, ending in lightning. */
const WEAPONS=[{name:'Walking staff',dmg:10,cd:0.55,range:64,col:'#b98a5e'},{name:'Ironwood staff',dmg:14,cd:0.5,range:66,col:'#8d959e'},{name:'Blessed staff',dmg:19,cd:0.46,range:70,col:'#ffe9a3'},
  {name:'Sunfire staff',dmg:25,cd:0.42,range:80,col:'#ffb347'},{name:'Lightning',dmg:32,cd:0.6,range:150,col:'#bfe3ff',bolt:true}];
const WEAPON_COST=[{wood:20,stone:20},{wood:30,stone:40,planks:10},{stone:50,planks:40,bread:10},{stone:80,planks:70,bread:30}];
const NODE={tree:{res:'wood',hp:4,regen:80},pine:{res:'wood',hp:4,regen:90},elder:{res:'wood',hp:8,regen:220,prot:true},rock:{res:'stone',hp:4,regen:140},ice:{res:'stone',hp:5,regen:160}};

function buildLayout(seed){
  L={seed,solid:new Map(),reserved:new Set(),road:new Set(),plots:[],patches:[],sites:{},bridge:{x0:0,x1:0},lamps:[]};
  const p1=hash2(seed,11,7)*TAU,p2=hash2(seed,5,23)*TAU;
  L.riverX=y=>30+4*Math.sin(y*0.07+p1)+3*Math.sin(y*0.023+p2);
  let x0=99,x1=-99;for(let tx=18;tx<44;tx++)if(isWater(tx,0)||isWater(tx,1)){x0=Math.min(x0,tx);x1=Math.max(x1,tx);}
  L.bridge={x0,x1};
  const E=30;
  const defs=[
    {id:'warehouse',type:'warehouse',x:-2,y:-7,ms:0,cost:{wood:20}},
    {id:'house1',type:'house',x:-8,y:-5,ms:0,cost:{wood:15,stone:5}},
    {id:'lumber',type:'lumber',x:-11,y:2,ms:0,cost:{wood:20,stone:10}},
    {id:'quarry',type:'quarry',x:8,y:-10,ms:1,cost:{wood:30,stone:15}},
    {id:'farm',type:'farm',x:-4,y:6,ms:1,cost:{wood:30,stone:10},field:[0,6]},
    {id:'house2',type:'house',x:5,y:-5,ms:1,cost:{wood:25,stone:15}},
    {id:'sawmill',type:'sawmill',x:-14,y:-4,ms:2,cost:{wood:40,stone:30}},
    {id:'bakery',type:'bakery',x:6,y:5,ms:2,cost:{wood:30,stone:30,planks:10}},
    {id:'tower',type:'tower',x:12,y:3,ms:2,cost:{stone:40,planks:15}},
    {id:'house3',type:'house',x:9,y:-4,ms:2,cost:{wood:30,planks:20}},
    {id:'bridge',type:'bridge',ms:2,cost:{wood:40,stone:20,planks:30}},
    {id:'house4',type:'house',x:-8,y:9,ms:3,cost:{planks:40,stone:20,bread:10}},
    {id:'house5',type:'house',x:3,y:11,ms:3,cost:{planks:40,stone:20,bread:10}},
    {id:'choiceA',choices:CHOICES,x:-15,y:5,ms:3,field:[-19,7]},
    {id:'choiceB',choices:CHOICES,x:11,y:8,ms:3,field:[14,8]},
    {id:'choiceC',choices:CHOICES,x:-3,y:-13,ms:4,field:[0,-13]},
    {id:'outpost',type:'outpost',x:E+12,y:-5,ms:3,req:'bridge',district:'frontier',cost:{planks:50,stone:40,bread:20}},
    {id:'f_lumber',type:'lumber',x:E+10,y:3,ms:3,req:'outpost',district:'frontier',cost:{wood:30,planks:20}},
    {id:'f_quarry',type:'quarry',x:E+18,y:3,ms:3,req:'outpost',district:'frontier',cost:{wood:30,planks:20}},
    {id:'f_guard',type:'guardpost',x:E+19,y:-5,ms:3,req:'outpost',district:'frontier',cost:{stone:40,planks:25}},
    {id:'f_house',type:'house',x:E+11,y:-10,ms:3,req:'outpost',district:'frontier',cost:{planks:40,stone:20,bread:10}},
  ];
  const reserve=(x,y,w,h,m)=>{for(let j=y-m;j<y+h+m;j++)for(let i=x-m;i<x+w+m;i++)L.reserved.add(tkey(i,j));};
  const solid=(x,y,w,h,ref)=>{for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)L.solid.set(tkey(i,j),ref);reserve(x,y,w,h,1);};
  for(const d of defs){
    const t=BT[d.type]||{w:3,h:2};d.w=d.type?t.w:3;d.h=d.type?t.h:2;d.district=d.district||'home';
    if(d.type==='bridge'){d.x=x0;d.y=0;d.zone={x:(x0-0.5)*TILE,y:1*TILE,r:1.3*TILE};reserve(x0-3,-1,x1-x0+7,4,0);}
    else{d.zone={x:(d.x+d.w/2)*TILE,y:(d.y+d.h+0.8)*TILE,r:1.25*TILE};solid(d.x,d.y,d.w,d.h,d.id);reserve(Math.floor(d.x+d.w/2)-1,d.y+d.h,3,2,0);}
    if(d.field)reserve(d.field[0],d.field[1],4,3,0);
    L.plots.push(d);
  }
  reserve(-1,-1,3,3,0);
  L.bell={x:3.5*TILE,y:2.6*TILE,r:1.2*TILE};reserve(2,1,3,3,0);
  L.anvil={x:-2.5*TILE,y:2.6*TILE,r:1.2*TILE};reserve(-4,1,3,3,0);
  L.rack={x:3.5*TILE,y:-2.4*TILE,r:1.2*TILE};reserve(2,-4,3,3,0);
  // inhabited sites
  const F={id:'fern',name:'Fernhollow',tx:-52,ty:44,r:14,huts:[[-5,-4],[3,-5],[-6,2],[4,2]]};
  const T={id:'thorn',name:'Thornback Grove',tx:-50,ty:-48,r:11};
  const R={id:'bandit',name:'Rustcloak Camp',tx:92,ty:10,r:12,tents:[[-4,-3],[2,-4],[-1,3]]};
  for(const s of [F,T,R]){s.x=s.tx*TILE;s.y=s.ty*TILE;L.sites[s.id]=s;}
  for(const h of F.huts)solid(F.tx+h[0],F.ty+h[1],2,2,'hut');
  solid(F.tx-1,F.ty-1,2,1,'stall');F.stall={x:F.x,y:(F.ty+0.9)*TILE,r:1.5*TILE};
  const tl=hyp(T.tx,T.ty);T.stone={x:(T.tx-T.tx/tl*(T.r+1.5))*TILE,y:(T.ty-T.ty/tl*(T.r+1.5))*TILE,r:1.5*TILE};
  R.stone={x:(R.tx-R.r-2)*TILE,y:R.y,r:1.5*TILE};
  for(const s of [T,R])reserve(Math.floor(s.stone.x/TILE)-1,Math.floor(s.stone.y/TILE)-1,3,3,0);
  for(const t of R.tents)solid(R.tx+t[0],R.ty+t[1],2,2,'tent');
  L.patches=[
    {x:-20,y:1,r:6,b:B_FOREST,d:0.42},{x:15,y:-14,r:5,b:B_ROCKY,d:0.36},
    {x:E+11,y:12,r:5.5,b:B_FOREST,d:0.42},{x:E+21,y:12,r:5,b:B_ROCKY,d:0.36},{x:E+15,y:-1,r:10,b:B_GRASS,d:0.02},
    {x:F.tx,y:F.ty,r:7.5,b:B_GRASS,d:0},{x:F.tx,y:F.ty,r:F.r,b:B_FOREST,d:0.3},
    {x:T.tx,y:T.ty,r:T.r,b:B_GROVE,d:0.15},
    {x:R.tx,y:R.ty,r:9,b:B_ROCKY,d:0},
  ];
  // roads: A* from the campfire to every home plot, then over the bridge to the frontier
  const addRoad=(ax,ay,bx,by)=>{const p=findPath(ax,ay,bx,by,6000,true);if(!p)return;for(const w of p.raw){const k=tkey(w[0],w[1]);L.road.add(k);L.reserved.add(k);}L.road.add(tkey(ax,ay));};
  for(const d of defs){if(d.type==='bridge'||d.district!=='home')continue;addRoad(0,0,Math.floor(d.zone.x/TILE),Math.floor(d.zone.y/TILE));}
  addRoad(0,0,3,2);addRoad(0,0,-3,2);addRoad(0,0,3,-3);addRoad(0,0,x0-1,0);
  for(let tx=x0-1;tx<=x1+1;tx++){L.road.add(tkey(tx,0));L.reserved.add(tkey(tx,0));}
  const oz=defs.find(d=>d.id==='outpost').zone,ox=Math.floor(oz.x/TILE),oy=Math.floor(oz.y/TILE);
  addRoad(x1+1,0,ox,oy);
  for(const d of defs)if(d.district==='frontier'&&d.id!=='outpost')addRoad(ox,oy,Math.floor(d.zone.x/TILE),Math.floor(d.zone.y/TILE));
  // lantern spots along home roads (revealed as the city grows)
  for(const k of L.road){const tx=Math.floor(k/65536)-32768,ty=(k%65536)-32768;if(tx*tx+ty*ty<196&&tx*tx+ty*ty>6&&hash2(seed+77,tx,ty)<0.16&&!L.solid.has(tkey(tx,ty-1)))L.lamps.push({x:(tx+0.5)*TILE+13,y:(ty+0.5)*TILE-10,o:hash2(seed+78,tx,ty)});}
  L.lamps.sort((a,b)=>a.o-b.o);
}

/* ---------- 3. WORLD & CHUNKS ---------- */
function isWater(tx,ty){return Math.abs(tx+0.5-L.riverX(ty+0.5))<1.7;}
function isBridge(tx,ty){return (ty===0||ty===1)&&tx>=L.bridge.x0&&tx<=L.bridge.x1;}
function patchAt(tx,ty){const x=tx+0.5,y=ty+0.5,wob=(hash2(L.seed+9,tx,ty)-0.5)*1.2;
  for(const p of L.patches){const dx=x-p.x,dy=y-p.y,r=p.r+(p.d>0?wob:0);if(dx*dx+dy*dy<r*r)return p;}return null;}
function biomeAt(tx,ty){
  if(tx>18&&tx<42){const d=Math.abs(tx+0.5-L.riverX(ty+0.5));if(d<1.7)return B_WATER;if(d<2.7)return B_SAND;}
  const p=patchAt(tx,ty);if(p)return p.b;
  if(tx*tx+ty*ty<169)return B_GRASS;
  const s=L.seed;
  const cold=fbm(s+3,tx/40,ty/40)*0.6+clamp((-ty-35)/70,0,1)*0.75;if(cold>0.72)return B_FROST;
  if(fbm(s+1,tx/26,ty/26)>0.6)return B_ROCKY;
  if(fbm(s+2,tx/20,ty/20)>0.52)return B_FOREST;
  return B_GRASS;
}
function nodeTypeFor(tx,ty,b){
  if(b===B_WATER||b===B_SAND||L.reserved.has(tkey(tx,ty)))return null;
  const r=hash2(L.seed+101,tx,ty),p=patchAt(tx,ty);
  if(p){if(p.d<=0||r>=p.d)return null;return b===B_ROCKY?'rock':b===B_GROVE?'elder':'tree';}
  if(tx*tx+ty*ty<169)return r<0.075?'tree':r>0.986?'rock':null;
  switch(b){
    case B_GRASS:return r<0.03?'tree':r>0.992?'rock':null;
    case B_FOREST:return r<0.32?'tree':r>0.995?'rock':null;
    case B_ROCKY:return r<0.2?'rock':r>0.975?'tree':null;
    case B_FROST:return r<0.09?'pine':r>0.95?'ice':null;
  }
  return null;
}
function poiFor(cx,cy){
  const s=L.seed;if(hash2(s+200,cx,cy)>0.2)return null;
  const tx=cx*CH+4+Math.floor(hash2(s+201,cx,cy)*8),ty=cy*CH+4+Math.floor(hash2(s+203,cx,cy)*8);
  if(hyp(tx,ty)<26)return null;
  for(const id in L.sites){const st=L.sites[id];if(hyp(tx-st.tx,ty-st.ty)<st.r+10)return null;}
  if(Math.abs(tx-L.riverX(ty))<6)return null;
  if(tx>28&&tx<62&&Math.abs(ty)<22)return null;
  const t=hash2(s+202,cx,cy),key=ckey(cx,cy),st=G.pois[key];
  const p={key,type:t<0.4?'cache':t<0.7?'stranded':'ruin',kind:Math.floor(hash2(s+204,cx,cy)*4),tx,ty,x:(tx+0.5)*TILE,y:(ty+0.5)*TILE,done:st===1,dwell:0,dt:0,hintT:0};
  if(p.type==='ruin'){p.cost={wood:12,stone:8};p.paid=(st&&typeof st==='object')?st:{};p.zone={x:p.x,y:p.y+1.5*TILE,r:1.25*TILE};}
  return p;
}
function genChunk(cx,cy){
  const c={cx,cy,k:ckey(cx,cy),tiles:new Uint8Array(CH*CH),nodes:[],canvas:null,live:true,poi:poiFor(cx,cy)};
  const mods=G.mods[c.k],poi=c.poi;
  for(let ly=0;ly<CH;ly++)for(let lx=0;lx<CH;lx++){
    const tx=cx*CH+lx,ty=cy*CH+ly,b=biomeAt(tx,ty),i=ly*CH+lx;c.tiles[i]=b;
    const type=nodeTypeFor(tx,ty,b);if(!type)continue;
    if(poi&&Math.abs(tx-poi.tx)<=2&&Math.abs(ty-poi.ty)<=2)continue;
    const d=NODE[type],h=hash2(L.seed+102,tx,ty);
    const n={i,c,tx,ty,x:(tx+0.5)*TILE+(h-0.5)*12,y:(ty+0.5)*TILE+((h*13%1)-0.5)*10,type,res:d.res,hp:d.hp,max:d.hp,dead:false,readyAt:0,claim:0,shake:0,prot:!!d.prot,s:0.85+(h*7%1)*0.35,badUntil:0,warned:false};
    n.wither=false;n.born=0;
    if(type==='tree'&&!lifeAt(tx,ty)){n.dead=true;n.hp=0;n.readyAt=Infinity;n.wither=true;}        // the land starts lifeless
    else if(mods&&mods[i]!==undefined){if(mods[i]>G.time){n.dead=true;n.hp=0;n.readyAt=mods[i];}else delete mods[i];}
    c.nodes.push(n);
  }

}
function killNode(n){n.dead=true;n.hp=0;n.claim=0;n.readyAt=G.time+NODE[n.type].regen;(G.mods[n.c.k]||(G.mods[n.c.k]={}))[n.i]=n.readyAt;}
function tickRegrow(){for(const c of G.chunks.values())for(const n of c.nodes)if(n.dead&&G.time>=n.readyAt){n.dead=false;n.hp=n.max;n.warned=false;const m=G.mods[c.k];if(m){delete m[n.i];}}}
function nodesNear(x,y,r,fn){const c0=Math.floor((x-r)/CHPX),c1=Math.floor((x+r)/CHPX),r0=Math.floor((y-r)/CHPX),r1=Math.floor((y+r)/CHPX);
  for(let cy=r0;cy<=r1;cy++)for(let cx=c0;cx<=c1;cx++){const c=G.chunks.get(ckey(cx,cy));if(!c)continue;const ns=c.nodes;for(let i=0;i<ns.length;i++){const n=ns[i];if(Math.abs(n.x-x)<=r&&Math.abs(n.y-y)<=r)fn(n);}}}
function anchors(){const a=[[G.player.x,G.player.y,2],[HOME.x,HOME.y,2]];if(G.B.outpost.built)a.push([G.B.outpost.zone.x,G.B.outpost.zone.y,2]);return a;}
function ensureChunks(all){
  let budget=all?999:3;const need=new Set(),A=anchors().map(a=>[Math.floor(a[0]/CHPX),Math.floor(a[1]/CHPX),a[2]]);
  for(const [cx,cy,r] of A)for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){const k=ckey(cx+i,cy+j);need.add(k);if(!G.chunks.has(k)&&budget>0){G.chunks.set(k,genChunk(cx+i,cy+j));budget--;}}

  for(const [k,c] of G.chunks){
    if(Math.max(Math.abs(c.cx-pc[0]),Math.abs(c.cy-pc[1]))>3)c.canvas=null;      // free far terrain bitmaps
    if(need.has(k))continue;let keep=false;

function revealAt(x,y,rt){const cs=FOGC*TILE,r=rt*TILE,c0=Math.floor((x-r)/cs),c1=Math.floor((x+r)/cs),r0=Math.floor((y-r)/cs),r1=Math.floor((y+r)/cs);
  for(let j=r0;j<=r1;j++)for(let i=c0;i<=c1;i++){if(hyp((i+0.5)*cs-x,(j+0.5)*cs-y)>r)continue;const cx=Math.floor(i/4),cy=Math.floor(j/4),k=ckey(cx,cy),bit=1<<((j-cy*4)*4+(i-cx*4)),m=G.fog.get(k)|0;if(!(m&bit))G.fog.set(k,m|bit);}}
function isSeen(x,y){const cs=FOGC*TILE,i=Math.floor(x/cs),j=Math.floor(y/cs),cx=Math.floor(i/4),cy=Math.floor(j/4);return ((G.fog.get(ckey(cx,cy))|0)>>((j-cy*4)*4+(i-cx*4)))&1;}

/* Life: the land starts withered. Each 4x4-tile cell remembers whether a miracle has woken it. */
function lifeAt(tx,ty){
  if(G.lifeAll||tx*tx+ty*ty<20)return true;
  const S=L.sites;if(hyp(tx-S.fern.tx,ty-S.fern.ty)<S.fern.r+1||hyp(tx-S.thorn.tx,ty-S.thorn.ty)<S.thorn.r+1)return true;      // forest folk and grove keep their own woods alive
  const i=Math.floor(tx/FOGC),j=Math.floor(ty/FOGC),cx=Math.floor(i/4),cy=Math.floor(j/4);
  return !!(((G.life.get(ckey(cx,cy))|0)>>((j-cy*4)*4+(i-cx*4)))&1);
}
function reviveNode(n){n.rainUntil=G.time+1.9;n.dead=false;n.wither=false;n.hp=n.max;n.warned=false;n.born=G.time;const m=G.mods[n.c.k];if(m)delete m[n.i];}
function bringLife(x,y,rt,witherOnly){       // wakes the ground and every withered or felled tree in range; returns trees woken
  const cs=FOGC*TILE,r=rt*TILE,c0=Math.floor((x-r)/cs),c1=Math.floor((x+r)/cs),r0=Math.floor((y-r)/cs),r1=Math.floor((y+r)/cs),dirty=new Set();
  for(let j=r0;j<=r1;j++)for(let i=c0;i<=c1;i++){if(hyp((i+0.5)*cs-x,(j+0.5)*cs-y)>r+cs*0.5)continue;const cx=Math.floor(i/4),cy=Math.floor(j/4),k=ckey(cx,cy),bit=1<<((j-cy*4)*4+(i-cx*4)),m=G.life.get(k)|0;
    if(!(m&bit)){G.life.set(k,m|bit);const li=i-cx*4,lj=j-cy*4,ax=li===0?-1:li===3?1:0,ay=lj===0?-1:lj===3?1:0;        // neighbours only when the cell touches a chunk edge
      dirty.add(k);if(ax)dirty.add(ckey(cx+ax,cy));if(ay)dirty.add(ckey(cx,cy+ay));if(ax&&ay)dirty.add(ckey(cx+ax,cy+ay));}}

  let n=0;nodesNear(x,y,r,nd=>{if(nd.res==='wood'&&nd.dead&&(nd.wither||!witherOnly)&&lifeAt(nd.tx,nd.ty)){reviveNode(nd);n++;}});return n;
}

/* ---------- 4. NAVIGATION (tile grid + bounded A*) ---------- */
function blocked(tx,ty,noBridge){
  if(L.solid.has(tkey(tx,ty)))return true;
  if(tx>18&&tx<42&&isWater(tx,ty))return !(!noBridge&&G&&G.B.bridge&&G.B.bridge.built&&isBridge(tx,ty));
  return false;
}
const bpx=(x,y)=>blocked(Math.floor(x/TILE),Math.floor(y/TILE));
function boxBlocked(x,y,r){return bpx(x-r,y-r)||bpx(x+r,y-r)||bpx(x-r,y+r)||bpx(x+r,y+r);}
function moveCollide(e,dx,dy,r){
  if(boxBlocked(e.x,e.y,r)){e.x+=dx;e.y+=dy;return;}        // never trap something already inside
  if(!boxBlocked(e.x+dx,e.y,r))e.x+=dx;
  if(!boxBlocked(e.x,e.y+dy,r))e.y+=dy;
}
function nearestFree(gx,gy,sx,sy,nb){let best=null,bd=1e9;
  for(let r=1;r<=3&&!best;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(Math.max(Math.abs(dx),Math.abs(dy))!==r||blocked(gx+dx,gy+dy,nb))continue;const d=hyp(gx+dx-sx,gy+dy-sy);if(d<bd){bd=d;best=[gx+dx,gy+dy];}}
  return best;}
function hpush(hI,hF,i,f){let n=hI.length;hI.push(i);hF.push(f);while(n>0){const p=(n-1)>>1;if(hF[p]<=f)break;hI[n]=hI[p];hF[n]=hF[p];n=p;}hI[n]=i;hF[n]=f;}
function hpop(hI,hF){const top=hI[0],li=hI.pop(),lf=hF.pop(),len=hI.length;if(len>0){let n=0;for(;;){let c=n*2+1;if(c>=len)break;if(c+1<len&&hF[c+1]<hF[c])c++;if(hF[c]>=lf)break;hI[n]=hI[c];hF[n]=hF[c];n=c;}hI[n]=li;hF[n]=lf;}return top;}
const DX8=[1,-1,0,0,1,1,-1,-1],DY8=[0,0,1,-1,1,-1,1,-1];
/* Returns {raw:[[tx,ty]..], pts:[[px,py]..]} or null. Search is bounded by a box and an expansion cap. */
function findPath(sx,sy,gx,gy,maxExp,nb){

  if(sx===gx&&sy===gy)return {raw:[[gx,gy]],pts:[[(gx+0.5)*TILE,(gy+0.5)*TILE]]};
  const pad=18,x0=Math.min(sx,gx)-pad,y0=Math.min(sy,gy)-pad,w=Math.abs(sx-gx)+1+pad*2,h=Math.abs(sy-gy)+1+pad*2;
  if(w*h>70000)return null;
  const gS=new Float32Array(w*h).fill(1e9),from=new Int32Array(w*h).fill(-1),closed=new Uint8Array(w*h),hI=[],hF=[];
  const si=(sy-y0)*w+(sx-x0),gi=(gy-y0)*w+(gx-x0);gS[si]=0;hpush(hI,hF,si,0);let exp=0,found=false;
  while(hI.length){

    const cl=cur%w,rl=(cur/w)|0,wx=cl+x0,wy=rl+y0;
    for(let d=0;d<8;d++){const dx=DX8[d],dy=DY8[d],nx=cl+dx,ny=rl+dy;if(nx<0||ny<0||nx>=w||ny>=h)continue;const ni=ny*w+nx;if(closed[ni])continue;
      if(blocked(wx+dx,wy+dy,nb))continue;if(dx&&dy&&(blocked(wx+dx,wy,nb)||blocked(wx,wy+dy,nb)))continue;
      const step=nb?(dx&&dy?2.6:1)*(L.road.has(tkey(wx+dx,wy+dy))?0.4:1):(dx&&dy?1.414:1);     // layout mode lays tidy, shared roads
      const ng=gS[cur]+step;if(ng<gS[ni]){gS[ni]=ng;from[ni]=cur;const hx=Math.abs(wx+dx-gx),hy=Math.abs(wy+dy-gy);hpush(hI,hF,ni,ng+(Math.max(hx,hy)+0.414*Math.min(hx,hy))*(nb?0.4:1));}}

function los(x0,y0,x1,y1){const d=hyp(x1-x0,y1-y0);if(d<1)return true;const n=Math.ceil(d/10),nx=-(y1-y0)/d*7,ny=(x1-x0)/d*7;

/* ---------- 5. STATE ---------- */
let VIEW={x0:-1e9,y0:-1e9,x1:1e9,y1:1e9};

    player:{x:TILE*1.9,y:TILE*1.7,hp:100,inv:zeroRes(),face:1,atkCd:0,hitCd:0,swing:0,swingA:0,flash:0,invuln:0,lastHurt:-99,walk:0,moving:false,target:null,foe:null,depT:0,fullT:-9},

    decor:0,pending:0,recruits:0,nextId:1,tool:0,anvil:{cost:TOOL_COST[0],paid:{},dwell:0,dt:0,hintT:-9},weapon:0,rack:{cost:WEAPON_COST[0],paid:{},dwell:0,dt:0,hintT:-9},bolts:[],tips:{},fly:0,ctx:null,terr:null,
    respawn:{thorn:[],bandit:[]},slowT:0,fastT:0,saveT:20,driftT:0,pathBudget:0,bellDwell:0,found:0,smokeT:0};
  for(const p of L.plots){
    const b={id:p.id,p,type:p.type||null,built:false,paid:{},cost:p.cost||null,zone:p.zone,dwell:0,dt:0,disabledUntil:0,craftT:0,active:0,shotCd:0,fields:null,hintT:-9,pile:0};
    if(b.type==='farm')makeFields(b);G.B[p.id]=b;
  }
}
function makeFields(b){const f=b.p.field;b.fields=[];for(let j=0;j<3;j++)for(let i=0;i<4;i++)b.fields.push({x:(f[0]+i+0.5)*TILE,y:(f[1]+j+0.5)*TILE,grow:hash2(L.seed,f[0]+i,f[1]+j)*0.6,claim:0});}

const maxHp=()=>100+G.up.hp*20;

const packCap=()=>PACK[G.ms]+G.up.pack*6;
const eastSide=(x,y)=>x>L.riverX(y/TILE)*TILE;

function nearestDepot(x,y){let best=null,bd=1e18;const e=eastSide(x,y);for(const b of depots()){const d=hyp(b.zone.x-x,b.zone.y-y)+(eastSide(b.zone.x,b.zone.y)!==e?3000:0);if(d<bd){bd=d;best=b;}}return best;}

// effects (all capped)
function spawnP(x,y,col,n,sp){if(!onScreen(x,y,60))return;for(let i=0;i<n&&G.particles.length<260;i++){const a=Math.random()*TAU,s=sp*(0.4+Math.random()*0.6);G.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-sp*0.5,t:0,life:0.4+Math.random()*0.4,col,size:2+Math.random()*2.5,g:260});}}

function celebrate(x,y){for(let i=0;i<5;i++)spawnP(x+(Math.random()-0.5)*90,y-30-Math.random()*40,['#ffd166','#ef8354','#9bdeac','#fff3c4','#8ecae6'][i],9,130);}
function hitNode(n){n.hp--;n.shake=0.25;spawnP(n.x,n.y-14,n.res==='wood'?'#c9935a':'#c5ccd3',4,70);if(n.hp<=0){spawnP(n.x,n.y-18,n.res==='wood'?'#7fb95a':'#aab2ba',9,100);killNode(n);}}

/* ---------- 6. BUILDINGS, JOBS, MILESTONES ---------- */
function needText(b){const c={};for(const r in b.cost){const n=b.cost[r]-(b.paid[r]||0);if(n>0)c[r]=n;}return costText(c);}
function chooseBuild(b,type){if(b.type||!CHOICES.includes(type))return;b.type=type;b.cost=CHOICE_COST[type];b.paid={};if(type==='farm')makeFields(b);toast(BT[type].name+' staked out — needs '+costText(b.cost)+'.','info');}
function finishBuilding(b){
  b.built=true;b.dwell=0;const nm=BT[b.type].name;revealAt(b.zone.x,b.zone.y,8);if(b.type!=='bridge')bringLife(b.zone.x,b.zone.y,3);celebrate(b.zone.x,b.zone.y-40);
  if(b.id==='house1'&&G.villagers.length===0)toast('House complete! Stand in the ring at its door to breathe life into your first villager ('+lifeCost()+' faith).','good');
  else if(b.type==='bridge')toast('The Old Bridge is restored. The eastern frontier is open — unknown folk may live out there.','good');
  else if(b.type==='outpost')toast('Frontier Outpost founded! Unload here too (it shares the city stock). New frontier plots are staked out nearby.','good');
  else toast(nm+' complete!','good');
  if(b.type==='warehouse')tip('wh','Unload your backpack inside the warehouse ring. Building sites use your backpack first, then city stock. The anvil by the sacred fire upgrades your axe; the staff rack trains fighting.');
  if(b.type==='lumber')tip('auto','Woodcutters stack their wood beside the lumber camp. Walk into its ring to load your backpack, or create more villagers — haulers carry piles to the warehouse.');
  if(b.type==='tower')tip('tower','Watchtowers and guards defend automatically during raids.');
  assignIdle();rebalance();checkMilestone();requestSave();
}
const ROLES=['woodcutter','hauler','miner','farmer','sawyer','baker','guard'];
const ROLE_NAME={hauler:'Haulers',woodcutter:'Woodcutters',miner:'Miners',farmer:'Farmers',sawyer:'Sawmill workers',baker:'Bakers',guard:'Guards'};
function jobSlots(){const s=[];for(const id in G.B){const b=G.B[id];if(!b.built)continue;const j=BT[b.type].jobs;if(!j)continue;
  for(const r in j){let used=0;for(const v of G.villagers)if(v.job&&v.job.b===id&&v.job.role===r)used++;s.push({b:id,role:r,cap:j[r],used});}}return s;}
function roleTotals(){const t={};for(const s of jobSlots()){const o=t[s.role]||(t[s.role]={cap:0,used:0});o.cap+=s.cap;o.used+=s.used;}return t;}
function assignIdle(force){
  for(const v of G.villagers){if(v.job||(v.manualIdle&&!force))continue;
    const all=jobSlots(),open=all.filter(s=>s.used<s.cap);if(!open.length)break;
    const tot={};for(const s of all){const o=tot[s.role]||(tot[s.role]={cap:0,used:0});o.cap+=s.cap;o.used+=s.used;}
    open.sort((a,b)=>(tot[a.role].used/tot[a.role].cap-tot[b.role].used/tot[b.role].cap)||(ROLES.indexOf(a.role)-ROLES.indexOf(b.role)));
    setJob(v,open[0].b,open[0].role);v.manualIdle=false;}
}
function unassignRole(role){const v=G.villagers.find(v=>v.job&&v.job.role===role);if(v){setJob(v,null);v.manualIdle=true;}}
function assignRole(role){const v=G.villagers.find(v=>!v.job),s=jobSlots().find(s=>s.role===role&&s.used<s.cap);if(v&&s){setJob(v,s.b,s.role);v.manualIdle=false;return true;}return false;}
const MS_REQ=[[['b','warehouse'],['b','house1'],['b','lumber'],['pop',2]],[['b','quarry'],['b','farm'],['pop',5]],[['b','sawmill'],['b','bakery'],['b','tower'],['pop',9]],[['b','bridge'],['b','outpost'],['pop',14]]];
const MS_UNLOCK=['',
  'Unlocked: Quarry, Farm and a second House. Backpack 30. Spent rock now mends faster while you are near. The anvil can now forge an Iron axe.',
  'Unlocked: Sawmill, Bakery, Watchtower, a third House and the Old Bridge to the east. New miracles: Bless and Awe. Guards, backpack 40, Steel axe at the anvil.',
  'Unlocked: Frontier Outpost beyond the bridge, two more Houses and two free-choice plots. Backpack 55, Master axe at the anvil.',
  'Unlocked: a final free-choice plot and backpack 70. Lanterns light every road.'];
const reqDone=r=>r[0]==='b'?G.B[r[1]].built:G.villagers.length>=r[1];
function checkMilestone(){if(G.ms>=4||!MS_REQ[G.ms].every(reqDone))return;G.ms++;banner('Your settlement is now a '+MS_NAMES[G.ms]+'!',MS_UNLOCK[G.ms]);celebrate(HOME.x,HOME.y);assignIdle();requestSave();}
/* ----- Faith and miracles ----- */
const MIRACLES=[
  {id:'bless',name:'Bless',cost:20,ms:2,col:'#ffe9a3'},{id:'awe',name:'Awe',cost:35,ms:2,col:'#f7a8b8'}];
const faithMax=()=>100+25*G.ms;
function lifeCost(){let c=Math.min(80,30+G.recruits*4);if(G.factions.fern.disc)c=Math.ceil(c*0.7);return c;}
const miracleCost=m=>m.cost;
const AURA=4.5;                 // tiles: your rain follows you and wakes the land for free
function castMiracle(id){
  const m=MIRACLES.find(m=>m.id===id),P=G.player;if(!m||G.ms<m.ms)return false;
  const cost=miracleCost(m),say=t=>{floatT(P.x,P.y-52,t,'#ffe9a8');return false;};let rad=3;
  if(G.faith<cost)return say('Not enough faith ('+Math.floor(G.faith)+'/'+cost+')');
  if(id==='stone'){                                   // refills spent rock
    rad=9;let n=0;nodesNear(P.x,P.y,rad*TILE,nd=>{if(nd.res==='stone'&&nd.dead&&hyp(nd.x-P.x,nd.y-P.y)<rad*TILE){reviveNode(nd);spawnP(nd.x,nd.y-10,'#d5dbe1',6,80);n++;}});
    if(!n)return say('No spent rock nearby');floatT(P.x,P.y-52,n+' rocks restored','#e3e8ee');
  }else if(id==='bless'){                                   // villagers work and walk faster for a while
    rad=9;let n=0;for(const v of G.villagers)if(hyp(v.x-P.x,v.y-P.y)<rad*TILE){v.bless=G.time+45;n++;}
    if(!n)return say('No villagers nearby');floatT(P.x,P.y-52,n+' villagers blessed','#ffe9a3');
  }else if(id==='awe'){                                     // a peaceful way to end a fight
    rad=7;let n=0;for(const e of G.enemies){if(e.dead||hyp(e.x-P.x,e.y-P.y)>rad*TILE)continue;n++;
      if(e.raid){if(e.loot){for(const r in e.loot)G.wh[r]+=e.loot[r];e.loot=null;}e.st='flee';e.failN=0;}else if(e.wild){e.dead=true;spawnP(e.x,e.y-10,'#c9ced6',8,80);}else e.stun=10;}
    if(!n)return say('Nothing here to drive away');floatT(P.x,P.y-52,'They cower before the light','#ffd9e2');
  }
  G.faith-=cost;if(G.rings.length<8)G.rings.push({x:P.x,y:P.y,t:0,r:rad*TILE,col:m.col});return true;
}
function updFaith(dt){
  const pop=G.villagers.length;G.fedT-=dt;
  if(G.fedT<=0){G.fedT=45;const need=Math.ceil(pop/4);if(pop&&G.wh.bread>=need){G.wh.bread-=need;G.fed=true;}else G.fed=false;}     // bread strengthens belief; running out costs nothing else
  const P=G.player;for(const id in G.B){const b=G.B[id];if(b.built&&b.fields&&b.type==='farm')for(const f of b.fields)if(f.grow<1&&hyp(f.x-P.x,f.y-P.y)<AURA*TILE)f.grow=Math.min(1,f.grow+dt/14);}      // fields ripen faster in your rain
  G.faithRate=(0.5+0.09*pop)*(G.fed?1.5:1)+(G.praying?1.6:0);G.faith=Math.min(faithMax(),G.faith+G.faithRate*dt);
  for(let i=G.rains.length-1;i>=0;i--){const r=G.rains[i];r.t-=dt;r.chk-=dt;
    if(r.chk<=0){r.chk=0.6;nodesNear(r.x,r.y,r.r,n=>{if(n.dead&&n.res==='wood'&&hyp(n.x-r.x,n.y-r.y)<r.r&&lifeAt(n.tx,n.ty))reviveNode(n);});}
    for(const id in G.B){const b=G.B[id];if(b.built&&b.fields&&b.type==='farm')for(const f of b.fields)if(f.grow<1&&hyp(f.x-r.x,f.y-r.y)<r.r)f.grow=Math.min(1,f.grow+dt/6);}
    if(r.t<=0)G.rains.splice(i,1);}
  for(let i=G.rings.length-1;i>=0;i--){G.rings[i].t+=dt*1.6;if(G.rings[i].t>=1)G.rings.splice(i,1);}
}
/* A newly finished workplace with nobody in it borrows one worker from the best-staffed role. */
function rebalance(){
  for(let guard=0;guard<6;guard++){
    const tot=roleTotals();let empty=null,rich=null;
    for(const r of ROLES){const o=tot[r];if(!o)continue;if(o.used===0&&!empty)empty=r;if(o.used>=2&&(!rich||o.used>tot[rich].used))rich=r;}
    if(!empty||!rich)return;
    const v=G.villagers.find(v=>v.job&&v.job.role===rich),s=jobSlots().find(s=>s.role===empty&&s.used<s.cap);if(!v||!s)return;
    setJob(v,s.b,s.role);
  }
}
function objective(){
  const open=()=>Object.values(G.B).find(b=>!b.built&&isUnlocked(b));
  if(G.ms>=4){const b=open();if(!b)return {t:'Your city thrives. Explore, restore ruins and tend the frontier.'};
    return b.type?{t:'Keep growing: '+BT[b.type].name+' needs '+needText(b),x:b.zone.x,y:b.zone.y}:{t:'A free plot awaits — stand in its ring to choose a building.',x:b.zone.x,y:b.zone.y};}
  for(const r of MS_REQ[G.ms]){if(reqDone(r))continue;
    if(r[0]==='b'){const b=G.B[r[1]];
      if(!isUnlocked(b))continue;
      return {t:(b.type==='bridge'?'Restore the ':'Build the ')+BT[b.type].name+' — needs '+needText(b),x:b.zone.x,y:b.zone.y};}
    const pop=G.villagers.length;
    if(pop<popCap()){const hs=Object.values(G.B).filter(b=>b.built&&b.type==='house'),P=G.player;let h=hs[0];for(const b of hs)if(hyp(b.zone.x-P.x,b.zone.y-P.y)<hyp(h.zone.x-P.x,h.zone.y-P.y))h=b;
      return G.faith>=lifeCost()&&h?{t:'Create a villager: stand in the ring at a house door ('+pop+'/'+r[1]+' villagers) — '+lifeCost()+' faith',x:h.zone.x,y:h.zone.y}:{t:'Gather faith to create a villager ('+pop+'/'+r[1]+') — needs '+lifeCost()+'. Praying at the altar is faster.',x:L.bell.x,y:L.bell.y};}
    const h=Object.values(G.B).find(b=>!b.built&&isUnlocked(b)&&b.type==='house');
    return h?{t:'Build a House for more villagers ('+pop+'/'+r[1]+') — needs '+needText(h),x:h.zone.x,y:h.zone.y}:{t:'Make room for more villagers: free-choice plots can become houses.'};}
  return {t:''};
}

/* ---------- 7. VILLAGERS ---------- */
const V_SPEED=74, CARRY=5;
const CRAFT={sawyer:{inp:'wood',out:'planks',keep:20,t:3},baker:{inp:'grain',out:'bread',keep:6,t:5}};
function spawnVillager(x,y,noAssign){
  const v={id:G.nextId++,x:x!==undefined?x:14.5*TILE,y:y!==undefined?y:0.5*TILE,job:null,st:'idle',t:0,carry:null,path:null,pi:0,gx:NaN,gy:NaN,tgt:null,field:null,
    repath:0,fail:0,wt:0,wx:0,wy:0,acc:0,face:1,walk:0,moving:false,working:false,hp:70,atkCd:0,look:Math.floor(Math.random()*5),manualIdle:false,wpx:NaN,wpy:0,wanderT:0,cx:0,cy:0,ct:0,foe:null};
  G.villagers.push(v);if(!noAssign)assignIdle();return v;
}
function release(v){v.src=null;if(v.tgt&&v.tgt.claim===v.id)v.tgt.claim=0;v.tgt=null;if(v.field&&v.field.claim===v.id)v.field.claim=0;v.field=null;v.path=null;v.gx=NaN;}
function setJob(v,bid,role){release(v);v.job=bid?{b:bid,role}:null;v.st='idle';v.t=0;v.foe=null;}
function warpHome(v){release(v);const z=v.job?G.B[v.job.b].zone:HOME;v.x=z.x;v.y=z.y;v.fail=0;v.st='idle';v.t=1;}
/* Shared mover for villagers and raiders. Returns 1 arrived, 0 on the way, -1 no route. */
function travel(v,x,y,dt,sp){
  if(hyp(x-v.x,y-v.y)<3){v.path=null;v.gx=NaN;return 1;}
  if((!v.path||v.gx!==x||v.gy!==y)&&v.repath<=0&&G.pathBudget>0){
    G.pathBudget--;v.repath=0.5+Math.random()*0.5;
    const p=findPath(Math.floor(v.x/TILE),Math.floor(v.y/TILE),Math.floor(x/TILE),Math.floor(y/TILE));
    if(!p){v.fail++;v.path=null;return -1;}
    const pts=smoothPath(v.x,v.y,p.pts);if(!bpx(x,y))pts[pts.length-1]=[x,y];
    v.path=pts;v.pi=0;v.gx=x;v.gy=y;v.wt=0;v.wx=v.x;v.wy=v.y;
  }
  if(!v.path)return 0;
  let rem=sp*dt;v.moving=true;v.walk+=dt*10;
  while(rem>0&&v.pi<v.path.length){const w=v.path[v.pi],dx=w[0]-v.x,dy=w[1]-v.y,d=hyp(dx,dy);
    if(d<=rem){v.x=w[0];v.y=w[1];rem-=d;v.pi++;}else{v.x+=dx/d*rem;v.y+=dy/d*rem;if(Math.abs(dx)>0.5)v.face=dx>0?1:-1;rem=0;}}
  if(v.pi>=v.path.length){const same=v.gx===x&&v.gy===y;v.path=null;v.gx=NaN;if(!same)return 0;if(hyp(x-v.x,y-v.y)<TILE*2.2){v.fail=0;return 1;}v.fail++;return -1;}
  v.wt+=dt;if(v.wt>5){if(hyp(v.x-v.wx,v.y-v.wy)<8){v.path=null;v.fail++;}v.wt=0;v.wx=v.x;v.wy=v.y;}   // stuck watchdog
  return 0;
}
function wander(v,cx,cy,rad,dt){
  v.wanderT-=dt;
  if(v.wanderT<=0){v.wanderT=3+Math.random()*4;for(let k=0;k<5;k++){const a=Math.random()*TAU,r=TILE*(0.8+Math.random()*rad),x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;if(!bpx(x,y)){v.wpx=x;v.wpy=y;break;}}}
  if(!isNaN(v.wpx)&&travel(v,v.wpx,v.wpy,dt,V_SPEED*0.55)!==0)v.wpx=NaN;
}
function findNode(v,b,kind){
  let best=null,bs=1e18;const east=eastSide(b.zone.x,b.zone.y);
  nodesNear(b.zone.x,b.zone.y,24*TILE,n=>{
    if(n.dead||n.res!==kind||n.prot||(n.claim&&n.claim!==v.id)||n.badUntil>G.time||eastSide(n.x,n.y)!==east)return;
    const s=hyp(n.x-v.x,n.y-v.y)+hyp(n.x-b.zone.x,n.y-b.zone.y)*0.5;if(s<bs){bs=s;best=n;}});
  return best;
}
function deliver(v,dt,b){
  if(!v.carry||!v.carry.n){v.carry=null;v.st='idle';v.t=0;return;}
  const d=nearestDepot(v.x,v.y);if(!d){wander(v,b.zone.x,b.zone.y,2,dt);return;}
  const a=v.id*1.7;
  if(travel(v,d.zone.x+Math.cos(a)*14,d.zone.y+Math.sin(a)*10,dt,V_SPEED*0.92)===1){
    G.wh[v.carry.res]+=v.carry.n;floatT(v.x,v.y-30,'+'+v.carry.n,RES_COL[v.carry.res]);v.carry=null;v.st='idle';v.t=0;}
}
/* Workers drop their load on the pile at their own workplace. */
function stash(v,dt,b){
  if(!v.carry||!v.carry.n){v.carry=null;v.st='idle';v.t=0;return;}
  if(v.carry.res!==PILE_RES[b.type]){deliver(v,dt,b);return;}
  const a=v.id*1.7;
  if(travel(v,b.zone.x+16+Math.cos(a)*8,b.zone.y-12+Math.sin(a)*5,dt,V_SPEED*0.92)===1){
    b.pile+=v.carry.n;floatT(v.x,v.y-30,'+'+v.carry.n,RES_COL[v.carry.res]);v.carry=null;v.st='idle';v.t=0;
    tip('pile','Goods pile up at the workplace that made them. Walk into its ring to load your backpack, or let haulers (a warehouse job) carry them to storage.');}
}
function updHauler(v,b,dt){
  switch(v.st){
  case 'idle':
    if(v.carry&&v.carry.n){v.st='toStore';return;}
    v.t-=dt;if(v.t>0){wander(v,b.zone.x,b.zone.y,2,dt);return;}
    {let best=null,bn=3;                                   // fullest unclaimed pile in this district
     for(const id in G.B){const s=G.B[id];if(!s.built||!PILE_RES[s.type]||s.p.district!==b.p.district)continue;
       let n=s.pile;for(const o of G.villagers)if(o!==v&&o.src===id)n-=10;if(n>bn){bn=n;best=s;}}
     if(best){v.src=best.id;v.st='toPile';}else v.t=1.5;}
    return;
  case 'toPile':{const s=G.B[v.src];if(!s||s.pile<=0){release(v);v.st='idle';v.t=0.5;return;}
    const r=travel(v,s.zone.x+14,s.zone.y-6,dt,V_SPEED);
    if(r===1){const n=Math.min(10,s.pile);s.pile-=n;v.carry={res:PILE_RES[s.type],n};release(v);v.st='toStore';}
    else if(r===-1){release(v);v.st='idle';v.t=1;}return;}
  case 'toStore':deliver(v,dt,b);return;
  default:v.st='idle';v.t=0;
  }
}
function updGatherer(v,b,dt,kind,off){
  if(v.carry&&v.carry.res!==kind&&v.st!=='toStore'){release(v);v.st='toStore';}
  switch(v.st){
  case 'idle':
    v.t-=dt;
    if(off){if(v.carry&&v.carry.n)v.st='toStore';else wander(v,b.zone.x,b.zone.y,2,dt);return;}
    if(v.t>0){wander(v,b.zone.x,b.zone.y,2,dt);return;}
    if(v.carry&&v.carry.n>=CARRY){v.st='toStore';return;}
    if(b.pile>=PILE_CAP){if(v.carry&&v.carry.n)v.st='toStore';else{v.t=2;wander(v,b.zone.x,b.zone.y,2,dt);}return;}     // pile full: wait for it to be hauled
    {const n=findNode(v,b,kind);if(n){n.claim=v.id;v.tgt=n;v.st='toNode';}else{b.starved=G.time;if(v.carry&&v.carry.n>0)v.st='toStore';else v.t=2;}}
    return;
  case 'toNode':{const n=v.tgt;if(!n||n.dead||n.claim!==v.id||!n.c.live){release(v);v.st='idle';v.t=0;return;}
    const r=travel(v,n.x,n.y+7,dt,V_SPEED);
    if(r===1){v.st='work';v.t=0;v.face=n.x>v.x?1:-1;}else if(r===-1){n.badUntil=G.time+40;release(v);v.st='idle';v.t=0.4;}return;}
  case 'work':{const n=v.tgt;if(!n||n.dead||!n.c.live){release(v);v.st='idle';v.t=0;return;}
    v.working=true;v.t+=dt;
    if(v.t>=1.3){v.t=0;const res=n.res;hitNode(n);if(!v.carry)v.carry={res,n:0};v.carry.n++;
      if(n.dead||v.carry.n>=CARRY){const full=v.carry.n>=CARRY;release(v);v.st=full?'toStore':'idle';v.t=0;}}
    return;}
  case 'toStore':stash(v,dt,b);return;
  default:v.st='idle';v.t=0;
  }
}
function updFarmer(v,b,dt,off){
  if(v.carry&&v.carry.res!=='grain'&&v.st!=='toStore'){release(v);v.st='toStore';}
  switch(v.st){
  case 'idle':
    v.t-=dt;
    if(off||v.t>0){if(off&&v.carry&&v.carry.n){v.st='toStore';return;}wander(v,b.zone.x,b.zone.y,2,dt);return;}
    if(v.carry&&v.carry.n>=6){v.st='toStore';return;}
    if(b.pile>=PILE_CAP){if(v.carry&&v.carry.n)v.st='toStore';else v.t=2;return;}
    {let best=null;for(const f of b.fields)if(!f.claim&&f.grow>=0.75&&(!best||f.grow>best.grow))best=f;
     if(best){best.claim=v.id;v.field=best;v.st='toField';}else if(v.carry&&v.carry.n>=4)v.st='toStore';else v.t=1.5;}
    return;
  case 'toField':{const f=v.field;if(!f){v.st='idle';return;}const r=travel(v,f.x,f.y,dt,V_SPEED);
    if(r===1){v.st='work';v.t=0;}else if(r===-1){release(v);v.st='idle';v.t=1;}return;}
  case 'work':{const f=v.field;if(!f){v.st='idle';return;}v.working=true;v.t+=dt;
    if(v.t>=5){if(!v.carry)v.carry={res:'grain',n:0};if(f.grow>=0.5)v.carry.n+=2;f.grow=0;spawnP(f.x,f.y-6,'#e6c34c',5,60);release(v);v.st='idle';v.t=0;}return;}
  case 'toStore':stash(v,dt,b);return;
  default:v.st='idle';v.t=0;
  }
}
function updCrafter(v,b,dt,off){           // honest simplification: draws inputs from shared warehouse stock, stacks output at the workshop
  const c=CRAFT[v.job.role];
  if(v.carry){v.st='toStore';deliver(v,dt,b);return;}
  const sx=b.zone.x-18,sy=b.zone.y-14;
  if(hyp(v.x-sx,v.y-sy)>4){travel(v,sx,sy,dt,V_SPEED);return;}
  v.face=1;if(off)return;
  const room=b.pile<PILE_CAP&&(c.out==='planks'?G.wh.planks+b.pile<G.wh.wood+40:true);
  if(G.wh[c.inp]>=2+c.keep&&room){
    v.working=true;b.active=0.3;b.craftT+=dt;
    if(b.craftT>=c.t){b.craftT=0;G.wh[c.inp]-=2;b.pile++;floatT(b.zone.x,b.zone.y-74,'+1 '+c.out,RES_COL[c.out]);}
  }
}
function hurtGuard(v,d){v.hp-=d;if(v.hp<=0){v.st='down';v.t=15;v.foe=null;floatT(v.x,v.y-34,'Guard falls back','#cfe3ff');}}
function updGuard(v,b,dt){
  const post=b.zone;
  if(v.st==='down'){v.t-=dt;travel(v,post.x,post.y-8,dt,V_SPEED);if(v.t<=0){v.hp=70;v.st='idle';}return;}
  if(v.hp<70)v.hp=Math.min(70,v.hp+dt*2);
  v.ct-=dt;
  if(v.ct<=0){v.ct=0.5;v.foe=null;let bd=24*TILE;for(const e of G.enemies){if(!e.raid||e.dead)continue;const d=hyp(e.x-post.x,e.y-post.y);if(d<bd){bd=d;v.foe=e;}}if(v.foe){v.cx=v.foe.x;v.cy=v.foe.y;}}
  const e=v.foe;
  if(e&&!e.dead){
    const d=hyp(e.x-v.x,e.y-v.y);
    if(d<34){v.working=true;v.face=e.x>v.x?1:-1;if(v.atkCd<=0){v.atkCd=0.8;damageEnemy(e,8,v.x,v.y,false);}}
    else if(d<70){const sp=V_SPEED*1.2*dt;moveCollide(v,(e.x-v.x)/d*sp,(e.y-v.y)/d*sp,6);v.moving=true;v.walk+=dt*10;v.face=e.x>v.x?1:-1;v.path=null;v.gx=NaN;}
    else travel(v,v.cx,v.cy,dt,V_SPEED*1.2);
    return;
  }
  wander(v,post.x,post.y,3.5,dt);
}
function updVillager(v,dt){
  if(hyp(v.x-G.player.x,v.y-G.player.y)>45*TILE){v.acc+=dt;if(v.acc<0.25)return;dt=v.acc;v.acc=0;}   // distant districts tick at 4 Hz
  if(v.bless>G.time)dt*=1.7;
  v.repath-=dt;v.atkCd-=dt;v.moving=false;v.working=false;
  if(v.fail>=5)warpHome(v);
  const b=v.job?G.B[v.job.b]:null,role=v.job?v.job.role:null;
  if(role==='guard'){updGuard(v,b,dt);return;}
  const R=G.raid,dist=b?b.p.district:'home';
  if(R.state==='active'&&R.target===dist){          // take shelter at the town centre / outpost
    if(v.st!=='shelter'){release(v);v.st='shelter';}
    const c=dist==='home'?HOME:G.B.outpost.zone,a=v.id*2.4;
    travel(v,c.x+Math.cos(a)*46,c.y+Math.sin(a)*38,dt,V_SPEED*1.25);return;
  }
  if(v.st==='shelter'){v.st='idle';v.t=0;}
  if(!b){if(v.carry&&v.carry.n)deliver(v,dt,{zone:HOME});else wander(v,HOME.x,HOME.y,4.5,dt);return;}
  const off=b.disabledUntil>G.time;
  if(role==='woodcutter')updGatherer(v,b,dt,'wood',off);
  else if(role==='miner')updGatherer(v,b,dt,'stone',off);
  else if(role==='farmer')updFarmer(v,b,dt,off);
  else if(role==='hauler')updHauler(v,b,dt);
  else updCrafter(v,b,dt,off);
}

/* ---------- 8. COMBAT & ENEMIES ---------- */
function spawnEnemy(kind,x,y,o){
  const e=Object.assign({id:G.nextId++,kind,fac:kind,x,y,hx:x,hy:y,hp:30,max:30,dmg:6,sp:62,raid:false,st:'idle',t:0,atkCd:1,flash:0,kx:0,ky:0,path:null,pi:0,gx:NaN,gy:NaN,
    repath:0,fail:0,failN:0,wt:0,wx:x,wy:y,face:1,walk:0,moving:false,wanderT:0,wpx:NaN,wpy:0,loot:null,dead:false,lunge:0},o);
  G.enemies.push(e);return e;
}
const isHostileNow=e=>!e.dead&&(e.raid||e.wild||G.factions[e.fac].h>=60);
function damageEnemy(e,d,fx,fy,byPlayer){
  if(e.dead)return;e.hp-=d;e.flash=0.12;const dx=e.x-fx,dy=e.y-fy,l=hyp(dx,dy)||1;e.kx=dx/l*90;e.ky=dy/l*90;
  floatT(e.x,e.y-36,''+d,'#ffe9a8');spawnP(e.x,e.y-14,'#fff3c4',4,60);
  if(e.hp<=0)killEnemy(e,byPlayer);
}
function killEnemy(e,byPlayer){
  e.dead=true;spawnP(e.x,e.y-12,e.kind==='thorn'?'#7d6bb0':'#8a3b33',12,90);
  if(e.loot){let any=false;for(const r in e.loot){G.wh[r]+=e.loot[r];any=true;}if(any)floatT(e.x,e.y-44,'Loot recovered','#bfe8a0');e.loot=null;}
  if(e.raid)G.raid.killed++;
  else if(!e.wild){G.respawn[e.fac].push(G.time+100);if(byPlayer)setHost(e.fac,G.factions[e.fac].h+(e.fac==='thorn'?10:3));}
}
function hurtPlayer(d){
  const P=G.player;if(P.invuln>0)return;P.hp-=d;P.lastHurt=G.time;P.flash=0.15;floatT(P.x,P.y-42,'-'+d,'#ff9a8a');
  if(P.hp<=0){P.x=HOME.x+30;P.y=HOME.y+34;P.hp=maxHp();P.invuln=4;P.target=null;P.foe=null;camSnap=true;
    toast('You were knocked out and carried back to the campfire. Nothing you carried was lost.','warn');}
}
function steer(e,tx,ty,sp,dt){const dx=tx-e.x,dy=ty-e.y,d=hyp(dx,dy);if(d<2)return true;const s=Math.min(d,sp*dt);moveCollide(e,dx/d*s,dy/d*s,7);e.moving=true;e.walk+=dt*10;if(Math.abs(dx)>1)e.face=dx>0?1:-1;return false;}
function raiderActs(e){
  const R=G.raid;
  if(e.role==='sabotage'){const b=G.B[e.bid];if(b&&b.built){b.disabledUntil=G.time+75;R.sabotaged.push(BT[b.type].name);toast('Raiders damaged the '+BT[b.type].name+' — it repairs itself in about a minute.','warn');}return;}
  let budget=6+2*G.ms;const loot={},order=RES.slice().sort((a,b)=>G.wh[b]-G.wh[a]);
  for(const r of order){if(budget<=0)break;const lim=Math.max(0,Math.floor(R.stock0[r]*0.25)-(R.taken[r]||0)),n=Math.min(budget,lim,G.wh[r]);
    if(n>0){G.wh[r]-=n;loot[r]=n;R.taken[r]=(R.taken[r]||0)+n;budget-=n;}}
  e.loot=loot;
}
function raiderEscapes(e){e.dead=true;const R=G.raid;R.escaped++;if(e.loot)for(const r in e.loot)R.stolen[r]=(R.stolen[r]||0)+e.loot[r];e.loot=null;}
function updRaider(e,dt,P){
  const R=G.raid;
  if(e.st==='flee'){const r=travel(e,R.sx,R.sy,dt,e.sp*1.2);if(r===1||(r===-1&&++e.failN>4)||hyp(e.x-R.sx,e.y-R.sy)<TILE*1.5)raiderEscapes(e);return;}
  let tgt=null,td=84,isP=false;
  if(P.invuln<=0){const d=hyp(P.x-e.x,P.y-e.y);if(d<td){td=d;tgt=P;isP=true;}}
  for(const v of G.villagers){if(!v.job||v.job.role!=='guard'||v.st==='down')continue;const d=hyp(v.x-e.x,v.y-e.y);if(d<td){td=d;tgt=v;isP=false;}}
  if(tgt){e.path=null;e.gx=NaN;if(td>24)steer(e,tgt.x,tgt.y,e.sp,dt);
    if(td<30&&e.atkCd<=0){e.atkCd=1.15;e.lunge=0.2;if(isP)hurtPlayer(e.dmg);else hurtGuard(tgt,e.dmg);}return;}
  if(e.st==='approach'){const r=travel(e,e.ox,e.oy,dt,e.sp);if(r===1){e.st='act';e.t=6;}else if(r===-1&&++e.failN>6)e.st='flee';}
  else if(e.st==='act'){e.t-=dt;if(e.t<=0){raiderActs(e);e.st='flee';e.failN=0;}}
}
function updEnemy(e,dt){
  e.atkCd-=dt;e.flash-=dt;e.lunge-=dt;e.repath-=dt;e.moving=false;
  if(Math.abs(e.kx)+Math.abs(e.ky)>2){moveCollide(e,e.kx*dt,e.ky*dt,7);e.kx*=0.82;e.ky*=0.82;}
  const P=G.player;
  if(e.raid){updRaider(e,dt,P);return;}
  if(e.stun>0){e.stun-=dt;return;}
  if(e.wild){                                             // wolves guard their prey and never stray far from it
    const dp=hyp(P.x-e.x,P.y-e.y),dh=hyp(P.x-e.hx,P.y-e.hy);
    if(P.invuln<=0&&dp<5.5*TILE&&dh<8*TILE){if(dp>22)steer(e,P.x,P.y,e.sp,dt);if(dp<28&&e.atkCd<=0){e.atkCd=1.2;e.lunge=0.2;hurtPlayer(e.dmg);}}
    else{if(e.hp<e.max)e.hp=Math.min(e.max,e.hp+dt*4);const a=G.time*0.9+e.id*2.1;steer(e,e.hx+Math.cos(a)*46,e.hy+Math.sin(a)*34,e.sp*0.55,dt);}
    return;
  }
  const f=G.factions[e.fac],s=L.sites[e.fac],dp=hyp(P.x-e.x,P.y-e.y);
  const pIn=hyp(P.x-s.x,P.y-s.y)<(s.r+2)*TILE;                      // leash: residents never leave their territory
  if(f.h>=60&&P.invuln<=0&&pIn&&dp<6.5*TILE){
    if(dp>24)steer(e,P.x,P.y,e.sp,dt);
    if(dp<30&&e.atkCd<=0){e.atkCd=1.1;e.lunge=0.2;hurtPlayer(e.dmg);}
  }else{
    if(e.hp<e.max)e.hp=Math.min(e.max,e.hp+dt*5);
    e.wanderT-=dt;if(e.wanderT<=0){e.wanderT=2+Math.random()*5;const a=Math.random()*TAU,r=Math.random()*TILE*3;e.wpx=e.hx+Math.cos(a)*r;e.wpy=e.hy+Math.sin(a)*r;}
    if(!isNaN(e.wpx)&&steer(e,e.wpx,e.wpy,e.sp*0.4,dt))e.wpx=NaN;
    if(dp<5*TILE&&!e.moving)e.face=P.x>e.x?1:-1;
  }
}
function updDefences(dt){
  for(const id in G.B){const b=G.B[id];if(!b.built)continue;if(b.active>0)b.active-=dt;
    if(b.fields&&b.type==='farm'&&b.disabledUntil<=G.time)for(const f of b.fields)if(f.grow<1)f.grow=Math.min(1,f.grow+dt/45);
    if((b.type==='tower'||b.type==='guardpost'||b.type==='outpost')&&G.raid.state==='active'){
      b.shotCd-=dt;if(b.shotCd>0)continue;b.shotCd=0.4;
      let best=null,bd=8.5*TILE;const cx=(b.p.x+b.p.w/2)*TILE,cy=b.p.y*TILE;
      for(const e of G.enemies){if(!e.raid||e.dead)continue;const d=hyp(e.x-cx,e.y-cy);if(d<bd){bd=d;best=e;}}
      if(best){b.shotCd=1.3;G.shots.push({x:cx,y:cy-30,e:best,dmg:9,a:0});}
    }
  }
}
function updShots(dt){for(let i=G.shots.length-1;i>=0;i--){const s=G.shots[i],e=s.e;if(e.dead){G.shots.splice(i,1);continue;}
  const dx=e.x-s.x,dy=e.y-14-s.y,d=hyp(dx,dy),sp=380*dt;s.a=Math.atan2(dy,dx);
  if(d<=sp+6){damageEnemy(e,s.dmg,s.x,s.y,false);G.shots.splice(i,1);}else{s.x+=dx/d*sp;s.y+=dy/d*sp;}}}

/* ---------- 9. FACTIONS & RAIDS ---------- */
const FAC={fern:{name:'Fernhollow',kind:'Forest village'},thorn:{name:'The Thornbacks',kind:'Territorial creatures'},bandit:{name:'The Rustcloaks',kind:'Raider camp'}};
const TRIBUTE={thorn:{grain:20},bandit:{bread:10,planks:15}};
const TRADES=[{give:{wood:20},get:{grain:10}},{give:{stone:20},get:{planks:8}},{give:{grain:12},get:{bread:6}}];
function facState(id){const f=G.factions[id];if(!f.disc)return 'Undiscovered';return id==='fern'?'Peaceful':f.h>=60?'Hostile':f.h>=25?'Wary':'Peaceful';}
function setHost(id,h){
  const f=G.factions[id],was=facState(id);
  if(id==='thorn'&&G.ms<2)h=Math.min(h,59);         // no hostile encounters before you have automation and can build defences
  f.h=clamp(h,0,100);const now=facState(id);
  if(now===was)return;
  if(now==='Hostile'){G.raid.cd=Math.max(G.raid.cd,90);toast(FAC[id].name+' are now HOSTILE. '+(id==='thorn'?'They will attack inside their grove and may raid.':'They may raid your city.')+' A tribute at their border stone can calm them.','bad');}
  else toast(FAC[id].name+' are now '+now.toLowerCase()+'.',now==='Peaceful'?'good':'warn');
}
function manageSites(dT,dB){
  for(const [id,d,n] of [['thorn',dT,5],['bandit',dB,4]]){
    const s=L.sites[id];
    if(d>50){for(const e of G.enemies)if(!e.raid&&e.fac===id)e.dead=true;continue;}     // dormant when far away
    if(d>36)continue;
    const rs=G.respawn[id];let alive=0,pending=0;for(const e of G.enemies)if(!e.raid&&e.fac===id&&!e.dead)alive++;
    for(let i=rs.length-1;i>=0;i--){if(rs[i]<=G.time)rs.splice(i,1);else pending++;}
    for(let tries=0;alive+pending<n&&tries<30;tries++){
      const a=Math.random()*TAU,r=TILE*(2+Math.random()*s.r*0.55),x=s.x+Math.cos(a)*r,y=s.y+Math.sin(a)*r;if(bpx(x,y))continue;
      spawnEnemy(id,x,y,id==='thorn'?{hp:36,max:36,dmg:7,sp:66}:{hp:34,max:34,dmg:8,sp:64});alive++;}
  }
}
function tickFactions(){
  const P=G.player,F=G.factions,S=L.sites;
  const dF=hyp(P.x-S.fern.x,P.y-S.fern.y)/TILE,dT=hyp(P.x-S.thorn.x,P.y-S.thorn.y)/TILE,dB=hyp(P.x-S.bandit.x,P.y-S.bandit.y)/TILE;
  if(!F.fern.disc&&dF<17){F.fern.disc=true;G.pending++;G.found++;revealAt(S.fern.x,S.fern.y,16);
    notice('Fernhollow discovered','<p><b>A peaceful forest village.</b> The Fernfolk are friendly and will stay that way.</p><p>Benefits: one settler is on their way to join you, creating villagers now costs 30% less faith, and their market stall trades goods from your warehouse stock.</p><p>No new risk comes from this discovery.</p>');}
  if(!F.thorn.disc&&dT<S.thorn.r+6){F.thorn.disc=true;F.thorn.h=10;G.found++;
    notice('Thornback Grove discovered','<p><b>A territorial creature species.</b> The ring of rune stones marks their grove.</p><p>Rules, so nothing surprises you: stepping inside makes them <b>wary</b>. Felling their marked elder trees, or attacking them, raises hostility. If they become <b>hostile</b> they attack inside the grove and can raid your city.</p><p>You can leave them alone entirely, and an offering of grain at the border stone calms them.</p>');}
  if(F.thorn.disc&&!F.thorn.entered&&dT<S.thorn.r){F.thorn.entered=true;if(F.thorn.h<30)setHost('thorn',30);toast('You have entered Thornback territory. Elder trees with a gold band are protected — felling them angers the grove.','warn');}
  if(!F.bandit.disc&&dB<19){F.bandit.disc=true;F.bandit.h=70;G.found++;G.raid.cd=Math.max(G.raid.cd,120);
    notice('Rustcloak Camp discovered','<p><b>A hostile raider camp.</b> Now that they have seen you, the Rustcloaks know about your city.</p><p><b>New risk:</b> from time to time they may send a small raid to steal some stored goods or briefly disable a workshop. You always get a warning with a direction and countdown. Buildings and villagers are never lost.</p><p>Your options: guards and watchtowers defend automatically; the Awe miracle sends raiders running without a fight; a tribute at the red border stone west of the camp buys a long peace; or turn raids off entirely in Menu.</p><p>The first raid cannot come for at least two minutes.</p>');}
  G.terr=(F.thorn.disc&&dT<S.thorn.r)?'thorn':(F.bandit.disc&&dB<S.bandit.r)?'bandit':null;
  if(++G.driftT>=15){G.driftT=0;
    if(F.bandit.disc&&F.bandit.h!==70)setHost('bandit',F.bandit.h+(F.bandit.h<70?1:-1));
    if(F.thorn.disc&&G.terr!=='thorn'){const base=F.thorn.pact?5:F.thorn.entered?30:10;if(F.thorn.h!==base)setHost('thorn',F.thorn.h+(F.thorn.h<base?1:-1));}}
  manageSites(dT,dB);
  for(const e of G.enemies)if(e.wild&&hyp(e.x-P.x,e.y-P.y)>60*TILE)e.dead=true;
}
function offerTribute(id){
  const c=TRIBUTE[id],f=G.factions[id];
  for(const r in c)if(G.wh[r]<c[r]){toast('Not enough in the warehouse — the tribute is '+costText(c)+'.','warn');return;}
  for(const r in c)G.wh[r]-=c[r];if(id==='thorn')f.pact=true;
  toast('Tribute accepted by '+FAC[id].name+'.','good');setHost(id,f.h-(id==='thorn'?40:45));
  if(G.raid.state==='warn'&&G.raid.fac===id&&f.h<60){G.raid.state='none';G.raid.cd=150;toast('The raid has been called off.','good');}
  requestSave();
}
function doTrade(i){const t=TRADES[i];if(!t)return;for(const r in t.give)if(G.wh[r]<t.give[r]){toast('Not enough in the warehouse for that trade.','warn');return;}
  for(const r in t.give)G.wh[r]-=t.give[r];for(const r in t.get)G.wh[r]+=t.get[r];toast('Traded '+costText(t.give)+' for '+costText(t.get)+'.','good');}
const COMPASS=['east','south-east','south','south-west','west','north-west','north','north-east'];
const compass=a=>COMPASS[((Math.round(a/(TAU/8))%8)+8)%8];
function planRaid(fac){
  const R=G.raid,s=L.sites[fac],target=(G.B.outpost.built&&Math.random()<0.35)?'frontier':'home';
  const goal=target==='home'?(G.B.warehouse.built?G.B.warehouse.zone:HOME):G.B.outpost.zone;
  const base=Math.atan2(s.y-goal.y,s.x-goal.x),tl=v=>Math.floor(v/TILE);let sp=null;
  for(let k=0;k<12&&!sp;k++){                       // nearest reachable spot towards the attackers' home
    const a=base+(k?((k%2?1:-1)*Math.ceil(k/2)*0.3):0),d=(k>6?14:19)*TILE,x=goal.x+Math.cos(a)*d,y=goal.y+Math.sin(a)*d;
    if(bpx(x,y))continue;if(findPath(tl(x),tl(y),tl(goal.x),tl(goal.y),9000))sp={x,y,a};}
  if(!sp){R.cd=60;return;}
  Object.assign(R,{state:'warn',t:40,fac,target,sx:sp.x,sy:sp.y,ang:sp.a,gx:goal.x,gy:goal.y});
  const msg=FAC[fac].name+' approach from the '+compass(sp.a)+(target==='frontier'?', heading for your FRONTIER outpost!':', heading for the city.');
  banner('Raid warning',msg);toast('Raid warning — guards and towers will defend, and villagers will take shelter. Watch the red arrow.','bad');
}
function launchRaid(){
  const R=G.raid,f=G.factions[R.fac],n=clamp(2+Math.floor(G.ms*0.75)+Math.floor((f.h-60)/15),2,7),works=[];
  for(const id in G.B){const b=G.B[id];if(b.built&&b.p.district===R.target&&['lumber','quarry','farm','sawmill','bakery'].includes(b.type))works.push(b);}
  Object.assign(R,{state:'active',t:0,stolen:{},taken:{},stock0:Object.assign({},G.wh),killed:0,escaped:0,total:n,sabotaged:[],left:n});
  for(let i=0;i<n;i++){
    const a=i*2.1;let x=R.sx+Math.cos(a)*14,y=R.sy+Math.sin(a)*14;if(bpx(x,y)){x=R.sx;y=R.sy;}
    const e=spawnEnemy(R.fac,x,y,{raid:true,st:'approach',hp:28+G.ms*5,max:28+G.ms*5,dmg:5+G.ms,sp:50});
    if(i===1&&works.length&&n>=3){const b=works[Math.floor(Math.random()*works.length)];e.role='sabotage';e.bid=b.id;e.ox=b.zone.x;e.oy=b.zone.y;}
    else{e.role='loot';e.ox=R.gx+Math.cos(a)*16;e.oy=R.gy+Math.sin(a)*12;}
  }
  toast('The raiders have arrived!','bad');
}
function endRaid(cancel){

function updRaid(dt){

    if(R.cd>0){R.cd-=dt;return;}

    R.chk-=dt;if(R.chk>0)return;R.chk=4;
    let fac=null;for(const id of ['bandit','thorn']){const f=G.factions[id];if(f.disc&&f.h>=60&&(!fac||f.h>G.factions[fac].h))fac=id;}   // never before discovery
    if(fac)planRaid(fac);

}

function fullMsg(){const P=G.player;if(G.time-P.fullT<2.5)return;P.fullT=G.time;floatT(P.x,P.y-48,'Backpack full','#ffd27a');tip('full','Backpack full: you stop gathering until you unload at the warehouse or donate at a building site.');}
function spawnDrop(x,y,res,flyNow){

  const a=Math.random()*TAU,s=flyNow?40:60+Math.random()*90;G.drops.push({x,y,res,vx:Math.cos(a)*s,vy:Math.sin(a)*s,age:0,fly:!!flyNow,fa:0});if(flyNow)G.fly++;

function updDrops(dt){

    const d=G.drops[i];d.age+=dt;const dx=P.x-d.x,dy=P.y-12-d.y,ds=hyp(dx,dy);
    if(!d.fly){
      d.x+=d.vx*dt;d.y+=d.vy*dt;d.vx*=0.88;d.vy*=0.88;

function harvest(P){
  let t=P.target;if(t&&(t.dead||!t.c.live||hyp(t.x-P.x,t.y-P.y)>HARV_R*1.25))t=null;       // target lock with a little slack

  P.target=t;P.ftarget=null;

    let f=null,fd=34;for(const id in G.B){const b=G.B[id];if(!b.built||b.type!=='farm'||!b.fields)continue;
      for(const q of b.fields){if(q.grow<0.75)continue;const d=hyp(q.x-P.x,q.y-P.y);if(d<fd){fd=d;f=q;}}}
    if(!f)return;P.ftarget=f;

    if(P.hitCd>0)return;
    P.hitCd=TOOLS[G.tool].hit;P.swing=0.16;P.swingA=Math.atan2(f.y-10-P.y,f.x-P.x);f.grow=0;spawnP(f.x,f.y-6,'#e6c34c',6,70);

/* Give one needed unit at a time. Only what the project still needs is ever taken. */
function donate(s,dt,useStock,tx,ty){

    for(const r in s.cost){if(s.cost[r]-(s.paid[r]||0)<=0)continue;
      if(P.inv[r]>0)P.inv[r]--;else if(useStock&&G.wh[r]>0)G.wh[r]--;else continue;
      s.paid[r]=(s.paid[r]||0)+1;fly(P.x,P.y-14,tx,ty,RES_COL[r]);gave=true;break;}}

function updZones(P,dt){

    if(G.weapon>G.ms){if(G.time-K.hintT>4){K.hintT=G.time;floatT(P.x,P.y-48,'Next fighting rank unlocks at '+MS_NAMES[G.weapon],'#ffe9a8');}}

function updPlayer(dt){

    if(P.atkCd<=0){P.atkCd=wp.cd;P.swing=wp.bolt?0:0.18;P.swingA=Math.atan2(foe.y-12-P.y,foe.x-P.x);P.face=foe.x>P.x?1:-1;const dmg=wp.dmg+G.up.dmg*3;

        const hit=[foe];for(const e of G.enemies){if(hit.length>=3)break;if(e!==foe&&isHostileNow(e)&&hyp(e.x-foe.x,e.y-foe.y)<100)hit.push(e);}

      }else damageEnemy(foe,dmg,P.x,P.y,true);}}

const DRY=[['#c9bd8c','#c1b584'],['#aea77a','#a69f74']];         // withered grass / withered forest floor
const BCOL=[['#93c76c','#8bc066'],['#74ab59','#6da454'],['#bdbaa6','#b2af9c'],['#eef3f6','#e2ebf1'],['#62aad8','#5aa2d1'],['#ead9a4','#e1d09a'],['#5f9c7c','#58937a']];

  for(let ly=0;ly<CH;ly++)for(let lx=0;lx<CH;lx++){g.fillStyle=pal(c.tiles[ly*CH+lx],ox+lx,oy+ly)[hash2(s+50,ox+lx,oy+ly)<0.5?0:1];g.fillRect(lx*TILE,ly*TILE,TILE,TILE);}
  for(let j=0;j<=CH;j++)for(let i=0;i<=CH;i++){            // soft organic borders between biomes
    const tx=ox+i,ty=oy+j,h=hash2(s+51,tx,ty),sx=tx-(h<0.5?1:0),sy=ty-((h*2%1)<0.5?1:0),b=biomeAt(sx,sy);

      g.beginPath();g.arc(x,y,g.lineWidth/2,0,TAU);g.fill();
      for(const [dx,dy] of [[1,0],[0,1],[1,1],[-1,1]]){if(!isR(tx+dx,ty+dy))continue;if(dx&&dy&&(isR(tx+dx,ty)||isR(tx,ty+dy)))continue;g.beginPath();g.moveTo(x,y);g.lineTo(x+dx*TILE,y+dy*TILE);g.stroke();}}
  }
  for(let ly=0;ly<CH;ly++)for(let lx=0;lx<CH;lx++){
    const tx=ox+lx,ty=oy+ly,b=c.tiles[ly*CH+lx],h=hash2(s+52,tx,ty),px=lx*TILE+4+(h*31%1)*24,py=ly*TILE+4+(h*17%1)*24;
    if(L.road.has(tkey(tx,ty))){if(h<0.3){g.fillStyle='#c9ab78';g.beginPath();g.arc(px,py,1.6,0,TAU);g.fill();}continue;}
    if(b<2&&!lifeAt(tx,ty)){if(h<0.22){g.strokeStyle='#9c8f62';g.lineWidth=1.5;g.beginPath();g.moveTo(px,py);g.lineTo(px-2,py-4);g.moveTo(px+3,py);g.lineTo(px+4,py-3);g.stroke();}else if(h>0.94){g.fillStyle='#b3a676';g.beginPath();g.ellipse(px,py,3,2,0,0,TAU);g.fill();}}
    else if(b===B_GRASS){if(h<0.4){g.strokeStyle='#6fae52';g.lineWidth=1.5;g.beginPath();g.moveTo(px,py);g.lineTo(px-2,py-5);g.moveTo(px+3,py);g.lineTo(px+4,py-4);g.stroke();}
      else if(h>0.92){g.fillStyle=['#fff6d8','#f7a8b8','#ffd166','#c9b6f2'][Math.floor(h*400)%4];g.beginPath();g.arc(px,py,2.2,0,TAU);g.fill();g.fillStyle='#f2b84b';g.beginPath();g.arc(px,py,0.9,0,TAU);g.fill();}}
    else if(b===B_FOREST){if(h<0.5){g.fillStyle=h<0.25?'#639a4c':'#84b765';g.beginPath();g.arc(px,py,2.5,0,TAU);g.fill();}}
    else if(b===B_ROCKY){if(h<0.5){g.fillStyle=h<0.25?'#a09d8b':'#cfccb9';g.beginPath();g.ellipse(px,py,3,2,0,0,TAU);g.fill();}}
    else if(b===B_FROST){if(h<0.4){g.fillStyle='#d3e2ee';g.beginPath();g.ellipse(px,py,5,2.5,0,0,TAU);g.fill();}}
    else if(b===B_WATER){if(h<0.5){g.strokeStyle='rgba(255,255,255,0.28)';g.lineWidth=1.5;g.beginPath();g.arc(px,py,5,Math.PI*1.15,Math.PI*1.85);g.stroke();}}

function facPanel(){

function tryImport(txt){

  try{d=JSON.parse(txt);}catch(e){m.textContent='That is not valid JSON.';return;}
  const backup=serialize();
  try{applySave(d);}catch(e){m.textContent=e.message||'That save could not be loaded.';try{applySave(backup);}catch(_){startNew();}return;}
  saveGame(false);closeModal();toast('Save imported.','good');
}
