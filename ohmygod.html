function bindInput(){
  const KEY={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
  window.addEventListener('keydown',e=>{
    if(e.target&&(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT'))return;
    if(e.code==='Escape'){if(ui.modal)closeModal();else menuPanel();return;}
    if(ui.modal)return;
    if(e.code==='KeyP'){ui.paused=!ui.paused;updateHud();return;}
    if(/^Digit[1-5]$/.test(e.code)&&!ui.paused){const m=MIRACLES[+e.code[5]-1];if(m){castMiracle(m.id);updateHud();}return;}
    const k=KEY[e.code];if(k){input.keys[k]=true;e.preventDefault();}else if(e.code==='Space')e.preventDefault();});
  window.addEventListener('keyup',e=>{const k=KEY[e.code];if(k)input.keys[k]=false;});
  window.addEventListener('blur',()=>{input.keys={};input.joy=null;});
  // virtual joystick: appears wherever the pointer goes down and follows a long drag
  const R=52;
  canvas.addEventListener('pointerdown',e=>{if(ui.modal||input.joy)return;input.joy={id:e.pointerId,sx:e.clientX,sy:e.clientY,dx:0,dy:0};try{canvas.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();});
  canvas.addEventListener('pointermove',e=>{const j=input.joy;if(!j||j.id!==e.pointerId)return;let dx=e.clientX-j.sx,dy=e.clientY-j.sy;const l=hyp(dx,dy);
    if(l>R){j.sx+=dx/l*(l-R);j.sy+=dy/l*(l-R);dx=dx/l*R;dy=dy/l*R;}
    const m=Math.min(1,l/R);if(m<0.14){j.dx=0;j.dy=0;}else{j.dx=dx/R;j.dy=dy/R;}e.preventDefault();});
  const end=e=>{if(input.joy&&input.joy.id===e.pointerId)input.joy=null;};
  canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('lostpointercapture',end);
  for(const ev of ['touchstart','touchmove'])canvas.addEventListener(ev,e=>e.preventDefault(),{passive:false});
  for(const ev of ['gesturestart','contextmenu','dblclick'])document.addEventListener(ev,e=>{if(!e.target.closest||!e.target.closest('#card'))e.preventDefault();});
  $('bPause').addEventListener('click',()=>{ui.paused=!ui.paused;$('bPause').textContent=ui.paused?'Resume':'Pause';updateHud();});
  $('bFolk').addEventListener('click',folkPanel);$('bFac').addEventListener('click',facPanel);$('bMenu').addEventListener('click',menuPanel);
  $('card').addEventListener('click',onCardClick);
  $('card').addEventListener('change',e=>{if(e.target.id==='optRaids'){G.settings.raids=e.target.checked;toast(G.settings.raids?'Raids enabled.':'Raids disabled — a fully peaceful game.','info');requestSave();}});
  $('ctx').addEventListener('click',onCtxClick);
  $('mirBtns').addEventListener('click',e=>{const el=e.target.closest('[data-m]');if(!el||el.disabled||ui.paused)return;castMiracle(el.dataset.m);updateHud();});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){input.keys={};input.joy=null;saveGame(false);}else lastTs=performance.now();});   // pause while hidden
  window.addEventListener('pagehide',()=>saveGame(false));
}

/* ---------- 13. SAVING ---------- */
function serialize(){
  const P=G.player,B={},wh=Object.assign({},G.wh);
  for(const e of G.enemies)if(e.raid&&!e.dead&&e.loot)for(const r in e.loot)wh[r]+=e.loot[r];      // an interrupted raid steals nothing
  for(const id in G.B){const b=G.B[id];if(b.built||Object.keys(b.paid).length||(!b.p.type&&b.type))B[id]={built:b.built,paid:b.paid,type:b.p.type?undefined:b.type,pile:b.pile||undefined};}
  const mods={};for(const k in G.mods){const m=G.mods[k],o={};let n=0;for(const i in m)if(m[i]>G.time){o[i]=Math.round(m[i]);n++;}if(n)mods[k]=o;else delete G.mods[k];}   // only still-depleted nodes
  return {game:'emberwick',v:SAVE_VERSION,savedAt:Date.now(),seed:G.seed,time:Math.round(G.time),ms:G.ms,
    player:{x:Math.round(P.x),y:Math.round(P.y),hp:Math.round(P.hp),inv:P.inv},up:G.up,wh,B,
    villagers:G.villagers.map(v=>({id:v.id,x:Math.round(v.x),y:Math.round(v.y),job:v.job,carry:v.carry,look:v.look,mi:v.manualIdle?1:0})),
    fog:[...G.fog],mods,pois:G.pois,factions:G.factions,raid:{cd:Math.round(G.raid.state==='none'?G.raid.cd:240)},
    settings:G.settings,tool:G.tool,toolPaid:G.anvil.paid,weapon:G.weapon,weaponPaid:G.rack.paid,faith:Math.round(G.faith),life:[...G.life],lifeAll:G.lifeAll||undefined,decor:G.decor,pending:G.pending,recruits:G.recruits,tips:G.tips,found:G.found};
}
const num=(v,d,a,b)=>Number.isFinite(v)?clamp(v,a,b):d;
function cleanRes(o){const r=zeroRes();if(o&&typeof o==='object')for(const k of RES)r[k]=Math.floor(num(o[k],0,0,1e7));return r;}
function validateSave(d){
  if(!d||typeof d!=='object'||Array.isArray(d))throw new Error('This is not a save file.');
  if(d.game!=='emberwick')throw new Error('This file is not an Emberwick save.');
  if(!Number.isInteger(d.v)||d.v<1)throw new Error('The save has no valid version number.');
  if(d.v>SAVE_VERSION)throw new Error('This save comes from a newer version of the game.');
  if(!Number.isFinite(d.seed))throw new Error('The save is missing its world seed.');
  if(!d.player||typeof d.player!=='object'||!Number.isFinite(d.player.x)||!Number.isFinite(d.player.y))throw new Error('The save is missing the player.');
  return d;
}
function migrate(d){
  if(d.v<2){d.tool=clamp(Math.floor(num(d.ms,0,0,4)),0,4);d.toolPaid={};d.v=2;}      // v1 tied tool strength to the milestone; keep what the player had
  if(d.v<3){d.lifeAll=true;d.faith=60;d.v=3;}
  if(d.v<4){d.weapon=clamp(Math.floor(num(d.tool,0,0,4)),0,4);d.weaponPaid={};d.v=4;}             // fighting strength used to come from the axe                                        // older worlds were never withered
  return d;}
function applySave(d){
  d=migrate(validateSave(d));newState(Math.floor(d.seed));mmCache.clear();
  G.lifeAll=d.lifeAll===true;if(Array.isArray(d.life))for(const e of d.life)if(Array.isArray(e)&&typeof e[0]==='string'&&/^-?\d+,-?\d+$/.test(e[0])&&Number.isFinite(e[1]))G.life.set(e[0],e[1]&0xffff);
  const P=G.player,obj=o=>o&&typeof o==='object'&&!Array.isArray(o);
  G.time=num(d.time,0,0,1e9);G.ms=Math.floor(num(d.ms,0,0,4));
  if(obj(d.up))for(const k in G.up)G.up[k]=Math.floor(num(d.up[k],0,0,50));
  P.x=clamp(d.player.x,-1e6,1e6);P.y=clamp(d.player.y,-1e6,1e6);P.inv=cleanRes(d.player.inv);P.hp=num(d.player.hp,100,1,maxHp());
  G.wh=cleanRes(d.wh);
  if(obj(d.B))for(const id in G.B){const s=d.B[id],b=G.B[id];if(!obj(s))continue;
    if(!b.p.type&&CHOICES.includes(s.type)){b.type=s.type;b.cost=CHOICE_COST[s.type];if(s.type==='farm')makeFields(b);}
    if(!b.type)continue;
    if(obj(s.paid))for(const r in b.cost){const n=Math.floor(num(s.paid[r],0,0,b.cost[r]));if(n>0)b.paid[r]=n;}
    b.built=!!s.built;if(b.built&&PILE_RES[b.type])b.pile=Math.floor(num(s.pile,0,0,999));}
  if(bpx(P.x,P.y)){P.x=HOME.x+30;P.y=HOME.y+34;}
  if(Array.isArray(d.fog))for(const e of d.fog)if(Array.isArray(e)&&typeof e[0]==='string'&&/^-?\d+,-?\d+$/.test(e[0])&&Number.isFinite(e[1]))G.fog.set(e[0],e[1]&0xffff);
  if(obj(d.mods))for(const k in d.mods){const m=d.mods[k];if(!obj(m))continue;const o={};for(const i in m)if(Number.isFinite(m[i])&&m[i]>G.time)o[i]=m[i];G.mods[k]=o;}
  if(obj(d.pois))for(const k in d.pois){const v=d.pois[k];if(v===1)G.pois[k]=1;else if(obj(v))G.pois[k]={wood:Math.floor(num(v.wood,0,0,12)),stone:Math.floor(num(v.stone,0,0,8))};}
  if(obj(d.factions))for(const id in G.factions){const s=d.factions[id],f=G.factions[id];if(!obj(s))continue;f.disc=!!s.disc;f.h=num(s.h,0,0,100);if('entered' in f)f.entered=!!s.entered;if('pact' in f)f.pact=!!s.pact;}
  G.raid.cd=obj(d.raid)?num(d.raid.cd,0,0,3600):0;
  if(obj(d.settings))G.settings.raids=d.settings.raids!==false;
  G.faith=num(d.faith,60,0,faithMax());
  G.weapon=Math.floor(num(d.weapon,0,0,4));G.rack.cost=WEAPON_COST[G.weapon]||null;
  if(G.rack.cost&&obj(d.weaponPaid))for(const r in G.rack.cost){const n=Math.floor(num(d.weaponPaid[r],0,0,G.rack.cost[r]));if(n>0)G.rack.paid[r]=n;}
  G.tool=Math.floor(num(d.tool,0,0,4));G.anvil.cost=TOOL_COST[G.tool]||null;
  if(G.anvil.cost&&obj(d.toolPaid))for(const r in G.anvil.cost){const n=Math.floor(num(d.toolPaid[r],0,0,G.anvil.cost[r]));if(n>0)G.anvil.paid[r]=n;}
  G.decor=Math.floor(num(d.decor,0,0,99));G.pending=Math.floor(num(d.pending,0,0,9));G.recruits=Math.floor(num(d.recruits,0,0,9999));G.found=Math.floor(num(d.found,0,0,1e6));
  if(obj(d.tips))for(const k in d.tips)G.tips[k]=1;
  if(Array.isArray(d.villagers))for(const s of d.villagers.slice(0,120)){
    if(!obj(s)||!Number.isFinite(s.x)||!Number.isFinite(s.y))continue;
    const v=spawnVillager(s.x,s.y,true);if(Number.isInteger(s.id)&&s.id>0&&s.id<1e9&&!G.villagers.some(o=>o!==v&&o.id===s.id)){v.id=s.id;G.nextId=Math.max(G.nextId,s.id+1);}v.look=Math.floor(num(s.look,0,0,4));v.manualIdle=!!s.mi;
    if(bpx(v.x,v.y)){v.x=HOME.x;v.y=HOME.y+40;}
    if(obj(s.carry)&&RES.includes(s.carry.res))v.carry={res:s.carry.res,n:Math.floor(num(s.carry.n,0,0,12))};
    if(obj(s.job)){const b=G.B[s.job.b];if(b&&b.built&&BT[b.type].jobs&&BT[b.type].jobs[s.job.role]){
      let used=0;for(const o of G.villagers)if(o.job&&o.job.b===b.id&&o.job.role===s.job.role)used++;
      if(used<BT[b.type].jobs[s.job.role])v.job={b:b.id,role:s.job.role};}}
  }
  assignIdle();ensureChunks(true);revealAt(P.x,P.y,10);camSnap=true;ui.last={};ui.ctxKey='?';
}
function saveGame(manual){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(serialize()));ui.lastSave=Date.now();ui.saveOK=true;if(manual)toast('Game saved.','good');}
  catch(e){ui.saveOK=false;if(manual||!ui.warnedSave){ui.warnedSave=true;toast('Could not save in this browser. Use Menu → Export save to keep your progress.','warn');}}
}
function loadGame(){
  let raw=null;try{raw=localStorage.getItem(SAVE_KEY);}catch(e){ui.saveOK=false;}
  if(!raw)return false;
  try{applySave(JSON.parse(raw));ui.lastSave=Date.now();return true;}
  catch(e){ui.loadErr=e.message||'unreadable';try{localStorage.setItem(SAVE_KEY+'-broken',raw);}catch(_){}return false;}
}
function startNew(){
  newState((Math.random()*2147483647)|0);mmCache.clear();ensureChunks(true);revealAt(HOME.x,HOME.y,12);camSnap=true;ui.last={};ui.ctxKey='?';ui.noticeQ=[];$('toasts').innerHTML='';$('banner').classList.remove('show');
  toast('The land has withered. Walk near the bare trees: a little rain gathers over each one and it grows. Chop them and carry 20 wood to the warehouse plot.','info');
}

/* ---------- 14. MAIN LOOP ---------- */
const STEP=1/60;let acc=0,lastTs=0,hudT=0,mmT=0;
function update(dt){
  G.time+=dt;G.pathBudget=4;                                   // cap on path searches per step
  const k=input.keys,P=G.player;
  if(input.joy){input.x=input.joy.dx;input.y=input.joy.dy;}else{input.x=(k.right?1:0)-(k.left?1:0);input.y=(k.down?1:0)-(k.up?1:0);}
  updPlayer(dt);
  for(const v of G.villagers)updVillager(v,dt);
  let dead=false;for(const e of G.enemies){if(!e.dead)updEnemy(e,dt);if(e.dead)dead=true;}
  if(dead)G.enemies=G.enemies.filter(e=>!e.dead);
  updDefences(dt);updShots(dt);updDrops(dt);updRaid(dt);updFaith(dt);
  for(let i=G.particles.length-1;i>=0;i--){const p=G.particles[i];p.t+=dt;if(p.t>=p.life){G.particles.splice(i,1);continue;}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  for(let i=G.floats.length-1;i>=0;i--){G.floats[i].t+=dt;if(G.floats[i].t>1.1)G.floats.splice(i,1);}
  for(let i=G.bolts.length-1;i>=0;i--){G.bolts[i].t+=dt/0.32;if(G.bolts[i].t>=1)G.bolts.splice(i,1);}
  for(let i=G.flies.length-1;i>=0;i--){G.flies[i].t+=dt/0.3;if(G.flies[i].t>=1)G.flies.splice(i,1);}
  G.fastT-=dt;if(G.fastT<=0){G.fastT=0.25;ensureChunks(false);revealAt(P.x,P.y,10);
    bringLife(P.x,P.y,AURA,true);                                                     // your rain wakes withered land as you walk
    nodesNear(P.x,P.y,AURA*TILE,n=>{if(n.dead&&!n.wither&&n.readyAt<1e9){n.rainUntil=G.time+0.6;n.readyAt-=0.75;const m=G.mods[n.c.k];if(m&&m[n.i]!==undefined)m[n.i]=n.readyAt;}});}   // stumps near you regrow 4x faster
  G.slowT-=dt;
  if(G.slowT<=0){G.slowT=1;tickRegrow();tickFactions();checkMilestone();
    if(G.pending>0&&G.villagers.length<popCap()){G.pending--;spawnVillager();toast('A Fernhollow settler has arrived to join you.','good');}
    for(const id in G.B){const b=G.B[id];if(!b.built)continue;const p=b.p;
      if(b.type==='house')smoke((p.x+p.w*0.66)*TILE+4,(p.y-p.h*0.42)*TILE);
      else if(b.type==='bakery'&&b.active>0)smoke((p.x+p.w*0.2)*TILE+5,(p.y-p.h*0.42)*TILE);
      if(b.disabledUntil>G.time)smoke((p.x+p.w/2)*TILE,p.y*TILE,'rgba(70,60,60,0.6)');}
  }
  G.saveT-=dt;if(G.saveT<=0){G.saveT=20;saveGame(false);}
}
function frame(ts){
  requestAnimationFrame(frame);
  let dt=(ts-lastTs)/1000;lastTs=ts;if(!(dt>0))dt=0;if(dt>0.25)dt=0.25;            // clamp long frame gaps
  const paused=ui.paused||!!ui.modal||document.hidden;
  if(!paused){acc+=dt;let n=0;while(acc>=STEP&&n<6){update(STEP);acc-=STEP;n++;}if(n===6)acc=0;}
  render(paused?0:dt);
  hudT-=dt;if(hudT<=0){hudT=0.2;updateHud();}
  mmT-=dt;if(mmT<=0){mmT=0.5;drawMinimap($('mini'));}
}
function init(){
  canvas=$('game');C=canvas.getContext('2d');resize();window.addEventListener('resize',resize);
  $('res').innerHTML=RES.map(r=>'<span class="chip" title="'+r+' in warehouse"><i class="ic '+r+'"></i><b id="w_'+r+'">0</b></span>').join('');
  bindInput();
  if(!loadGame()){startNew();if(ui.loadErr)toast('Your saved game could not be read ('+ui.loadErr+'), so a new one was started. The old data was kept as a backup.','warn');}
  else toast('Welcome back to Emberwick.','info');
  updateHud();
  requestAnimationFrame(ts=>{lastTs=ts;frame(ts);});
}
if(typeof window!=='undefined'&&!window.__EMBERWICK_TEST__)init();
</script>
